syntax = "proto3";

package atracciones;

// Contrato gRPC base (Reto 2)
// Los estudiantes deberán expandir este archivo para integraciones de alto rendimiento (streaming / unary).

service AtraccionesService {
  rpc GetAtraccion (GetAtraccionRequest) returns (AtraccionResponse);
}

message GetAtraccionRequest {
  string id = 1;
}

message AtraccionResponse {
  string id = 1;
  string nombre = 2;
  double precioTicket = 3;
  bool estaActivo = 4;
}
