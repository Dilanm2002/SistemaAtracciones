# Esquema federado GraphQL (Reto 3 - Apollo Federation)

type Atraccion @key(fields: "id") {
  id: ID!
  nombre: String!
  descripcion: String!
  ciudad: String!
  latitud: Float!
  longitud: Float!
  precioTicket: Float!
  duracionHoras: Int!
  estaActivo: Boolean!
}

extend type Query {
  atraccion(id: ID!): Atraccion
  atracciones: [Atraccion!]!
}
