services:
  postgres:
    image: postgres:16
    container_name: descubre_ec_db
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente en 5432
      - '${DB_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
