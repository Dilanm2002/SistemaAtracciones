# Define la versión del estándar OpenAPI que estamos utilizando.
openapi: 3.0.3

# Sección de metadatos de la API
info:
  # El nombre de la API que aparecerá en la documentación
  title: GDS Autos Core API
  # Una descripción detallada de lo que hace este microservicio
  description: Microservicio centralizado para búsqueda, disponibilidad, reservas (órdenes) y postventa de renta de autos.
    El dueño de la reserva (ownerId) se infiere del sub del token JWT. La lógica de pagos pertenece a otros dominios/APIs.
  # La versión actual del contrato/API
  version: 1.0.0
  # Información de contacto de los responsables de la API
  contact:
    name: Joselyn Cadena
    email: jlcadenac@puce.edu.ec

# Lista de servidores donde la API está alojada
servers:
# URL del entorno de Producción
- url: https://api.booking-hub.com/autos/v1
  description: Producción
# URL del entorno de Pruebas o Sandbox
- url: https://sandbox.api.booking-hub.com/autos/v1
  description: Sandbox

# Configuración global de seguridad. Todos los endpoints exigirán esto por defecto.
security:
# Especifica que usaremos el esquema de seguridad OAuth2 definido más abajo
- OAuth2Security: []

# Categorías visuales para organizar la documentación (Swagger)
tags:
- name: Búsqueda y Catálogo
- name: Información de Agencias y Proveedores
- name: Gestión de Órdenes (Reservas)
- name: Componentes Comunes
- name: Webhooks

# Aquí definimos todas las rutas (URLs) de nuestra API
paths:
  
  # Endpoint para buscar renta de autos
  /search:
    # Método HTTP POST
    post:
      # Asignamos este endpoint a la categoría "Búsqueda y Catálogo"
      tags:
      - Búsqueda y Catálogo
      # Un resumen corto de lo que hace el endpoint
      summary: Búsqueda de renta de vehículos
      # Sobreescribe la seguridad global: este endpoint es público (no requiere token)
      security: []
      # Parámetros que la petición recibe en la URL o en los Headers
      parameters:
      # Definimos un header obligatorio llamado X-Affiliate-Id
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      # El cuerpo de la petición (JSON que el cliente debe enviar)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Hace referencia al esquema 'CarSearchRequest' definido en components
              $ref: '#/components/schemas/CarSearchRequest'
      # Las posibles respuestas que este endpoint puede devolver
      responses:
        # Si todo sale bien (Código 200 OK)
        '200':
          description: Vehículos encontrados
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=300'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                # Hace referencia al esquema de respuesta
                $ref: '#/components/schemas/CarSearchResponse'
        # Si el cliente envía datos inválidos (Código 400)
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        # Si el cliente hace demasiadas peticiones (Código 429)
        '429':
          $ref: '#/components/responses/ProblemDetails429'
  
  # Endpoint para listar agencias o puntos de recogida (depots)
  /depots:
    post:
      tags:
      - Información de Agencias y Proveedores
      summary: Consultar lista de agencias de renta (puntos de recogida y entrega)
      security: []
      parameters:
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepotsRequest'
      responses:
        '200':
          description: Lista de agencias (depots)
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=3600'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepotsResponse'
  
  # Endpoint para obtener las calificaciones de las agencias
  /depots/reviews/scores:
    post:
      tags:
      - Información de Agencias y Proveedores
      summary: Obtener puntuaciones y reseñas de las agencias
      security: []
      parameters:
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepotScoresRequest'
      responses:
        '200':
          description: Puntuaciones desglosadas por agencia
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=600'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepotScoresResponse'
  
  # Endpoint para obtener detalles extendidos de los vehículos
  /details:
    post:
      tags:
      - Búsqueda y Catálogo
      summary: Obtener especificaciones y características de los vehículos
      security: []
      parameters:
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarDetailsRequest'
      responses:
        '200':
          description: Detalles de los vehículos solicitados
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=300'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarDetailsResponse'
  
  # Endpoint para ver los proveedores (Ej. Hertz, Avis, Enterprise)
  /suppliers:
    post:
      tags:
      - Información de Agencias y Proveedores
      summary: Listar proveedores de renta de autos
      security: []
      parameters:
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppliersRequest'
      responses:
        '200':
          description: Lista de proveedores de renta de autos
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=3600'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuppliersResponse'
  
  # Endpoint para listas estáticas o constantes (ej. políticas de combustible, tipos de transmisión)
  /constants:
    post:
      tags:
      - Componentes Comunes
      summary: Consultar constantes del sistema (políticas, seguros, servicios extra)
      security: []
      parameters:
      - name: X-Affiliate-Id
        in: header
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarConstantsRequest'
      responses:
        '200':
          description: Constantes del sistema
          headers:
            Cache-Control:
              schema:
                type: string
                example: 'public, max-age=86400'
            X-API-Deprecation-Date:
              schema:
                type: string
                format: date
                description: Fecha prevista de baja de esta versión de la API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarConstantsResponse'
  
  # Endpoint ficticio incorporado para homologar con Vuelos (Bloqueo Temporal / Hold)
  /orders/hold:
    post:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Bloquear temporalmente el vehículo y precio (Hold)
      security:
      - OAuth2Security:
        - autos:book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderHoldRequest'
      responses:
        '200':
          description: Vehículo bloqueado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHoldResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          $ref: '#/components/responses/ProblemDetails409'

  # Endpoint para previsualizar el precio final de la renta antes de pagar
  /orders/preview:
    post:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Previsualizar la orden de renta antes de confirmar
      # Requiere permiso de lectura
      security:
      - OAuth2Security:
        - autos:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPreviewRequest'
      responses:
        '200':
          description: Detalles de la orden previsualizada y precios finales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPreviewResponse'
  
  # Endpoint para crear formalmente la reserva de renta de auto (Orden)
  /orders/create:
    post:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Crear orden/reserva de renta de vehículo
      # Requiere permiso de escritura/reserva
      security:
      - OAuth2Security:
        - autos:book
      parameters:
      # Header usado para evitar cobros dobles si hay un error de red
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        # Código 201 significa 'Creado con éxito'
        '201':
          description: Orden creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        # Código 409: Conflicto (Ej. el auto ya no está disponible)
        '409':
          $ref: '#/components/responses/ProblemDetails409'
  
  # Endpoint para ver el detalle de una orden existente usando su ID en la URL
  /orders/{orderId}:
    # Método HTTP GET (solo leer datos, no modificar)
    get:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Obtener detalles de la orden
      security:
      - OAuth2Security:
        - autos:read
      parameters:
      # Parámetro que va en la ruta (URL), por ejemplo /orders/123e4567-e89b...
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Detalles completos de la orden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        # Código 404: No encontrado (la orden no existe)
        '404':
          $ref: '#/components/responses/ProblemDetails404'
  
  # Endpoint para modificar datos en una reserva (Ej. añadir sillas de bebé o cambiar fecha)
  /orders/{orderId}/modify:
    post:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Modificar una orden existente
      security:
      - OAuth2Security:
        - autos:book
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderModifyRequest'
      responses:
        '200':
          description: Orden modificada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
  
  # Endpoint para cancelar una renta de auto
  /orders/{orderId}/cancel:
    post:
      tags:
      - Gestión de Órdenes (Reservas)
      summary: Cancelar una orden de renta
      # Requiere un permiso especial para cancelaciones
      security:
      - OAuth2Security:
        - autos:cancel
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Cancelación procesada
        '409':
          $ref: '#/components/responses/ProblemDetails409'
  
  # Endpoint para listar webhooks (URLs a las que la API te enviará notificaciones automáticas)
  /webhooks:
    get:
      tags:
      - Webhooks
      summary: Listar suscripciones a eventos
      security:
      - OAuth2Security:
        - autos:webhooks
      responses:
        '200':
          description: Suscripciones activas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookSubscription'
    
    # Endpoint para registrar una nueva URL que recibirá notificaciones
    post:
      tags:
      - Webhooks
      summary: Registrar un nuevo webhook
      security:
      - OAuth2Security:
        - autos:webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscription'
      # 'callbacks' documenta cómo será la petición que la API le enviará a tu webhook
      callbacks:
        carEvent:
          '{$request.body#/url}':
            post:
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhookPayload'
              responses:
                '200':
                  description: Evento recibido exitosamente
      responses:
        '201':
          description: Webhook registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
  
  # Endpoint para eliminar una suscripción de webhook
  /webhooks/{id}:
    delete:
      tags:
      - Webhooks
      summary: Eliminar suscripción de webhook
      security:
      - OAuth2Security:
        - autos:webhooks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Suscripción eliminada

# Componentes reutilizables. Aquí definimos moldes para no repetir código.
components:
  
  # Moldes de Seguridad
  securitySchemes:
    # Definimos cómo funciona el OAuth2 para autos
    OAuth2Security:
      # Tipo de seguridad
      type: oauth2
      # Flujos permitidos en OAuth2
      flows:
        # Flujo para usuarios que inician sesión (ej. con correo y contraseña)
        authorizationCode:
          authorizationUrl: https://auth.booking-hub.com/oauth2/authorize
          tokenUrl: https://auth.booking-hub.com/oauth2/token
          # Permisos disponibles (scopes)
          scopes:
            autos:read: Leer información de autos, catálogos y reservas
            autos:book: Crear, mantener en hold y alterar reservas
            autos:cancel: Cancelar reservas
            autos:webhooks: Gestionar webhooks
        # Flujo para sistemas automáticos o máquinas (backend a backend)
        clientCredentials:
          tokenUrl: https://auth.booking-hub.com/oauth2/token
          scopes:
            autos:read: (B2B) Leer
            autos:book: (B2B) Comprar
            autos:cancel: (B2B) Cancelar
            autos:webhooks: (B2B) Webhooks
  
  # Moldes de Respuestas de Error estandarizadas
  responses:
    ProblemDetails400:
      description: Petición inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails403:
      description: Prohibido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: No encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: Conflicto (Ej. Auto no disponible, cambio de tarifa, agencia cerrada)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails429:
      description: Demasiadas peticiones al límite de cuota
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  
  # Moldes de Datos (Schemas). Definimos los JSON exactos que viajan en las peticiones.
  schemas:
    
    # Esquema estándar para reportar errores detallados
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          # Valores posibles para el código de error en renta de autos
          enum:
          - VALIDATION_FAILED
          - CAR_NO_LONGER_AVAILABLE
          - PRICE_CHANGED
          - DEPOT_CLOSED
          - DRIVER_AGE_RESTRICTION
          - BOOKING_NOT_CONFIRMED
          - CANCELLATION_NOT_ALLOWED
          - RATE_LIMIT_EXCEEDED
          - PAYMENT_REFERENCE_INVALID
          - PAYMENT_NOT_AUTHORIZED
        # Lista de parámetros inválidos para detallar fallas de validación
        invalidParams:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              reason:
                type: string
    
    # Esquema que representa a la persona que realiza la reserva
    Booker:
      type: object
      required:
      - country
      properties:
        country:
          type: string
          pattern: ^[a-z]{2}$
          description: Código ISO 3166-1 alpha-2 del país del comprador.
    
    # Esquema que representa al conductor principal (Afecta precios y disponibilidad)
    Driver:
      type: object
      required:
      - age
      properties:
        age:
          type: integer
          minimum: 18
          maximum: 99
          description: Edad del conductor.
    
    # Representa un punto de geolocalización o ciudad (Ej. Aeropuerto AMS o Ciudad)
    LocationPoint:
      type: object
      properties:
        airport:
          type: string
          description: Código IATA de aeropuerto, si aplica (Ej. AMS).
        city_id:
          type: integer
          description: ID interno de la ciudad.
        coordinates:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
    
    # Esquema que define dónde se recoge y se entrega el auto, y a qué hora
    Route:
      type: object
      required:
      - dropoff
      - pickup
      properties:
        dropoff:
          type: object
          required:
          - datetime
          - location
          properties:
            datetime:
              type: string
              format: date-time
            location:
              $ref: '#/components/schemas/LocationPoint'
        pickup:
          type: object
          required:
          - datetime
          - location
          properties:
            datetime:
              type: string
              format: date-time
            location:
              $ref: '#/components/schemas/LocationPoint'
    
    # JSON que se envía al buscar vehículos
    CarSearchRequest:
      type: object
      required:
      - booker
      - currency
      - driver
      - route
      properties:
        booker:
          $ref: '#/components/schemas/Booker'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        driver:
          $ref: '#/components/schemas/Driver'
        route:
          $ref: '#/components/schemas/Route'
        filters:
          type: object
          properties:
            car_types:
              type: array
              items:
                type: string
            transmission:
              type: array
              items:
                type: string
        maximum_results:
          type: integer
          minimum: 10
          maximum: 500
          default: 100
        language:
          type: string
        page:
          type: string
    
    # Respuesta con los vehículos disponibles
    CarSearchResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
            # Representa un auto en la búsqueda
            properties:
              vehicle_id:
                type: string
              price:
                type: number
              supplier_id:
                type: integer
        metadata:
          type: object
          properties:
            total_results:
              type: integer
            next_page:
              type: string
              nullable: true
        search_token:
          type: string
          description: Token necesario para el contexto de las siguientes peticiones.
    
    DepotsRequest:
      type: object
      properties:
        last_modified:
          type: string
          format: date-time
        maximum_results:
          type: integer
          default: 100
        languages:
          type: array
          items:
            type: string
        page:
          type: string
    
    DepotsResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              depot_id:
                type: integer
              name:
                type: string
              location:
                $ref: '#/components/schemas/LocationPoint'
        metadata:
          type: object
    
    DepotScoresRequest:
      type: object
      properties:
        maximum_results:
          type: integer
          default: 100
        page:
          type: string
    
    DepotScoresResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              depot_id:
                type: integer
              score:
                type: number
        metadata:
          type: object
    
    CarDetailsRequest:
      type: object
      properties:
        last_modified:
          type: string
          format: date-time
        maximum_results:
          type: integer
        page:
          type: string
    
    CarDetailsResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              vehicle_id:
                type: string
              make:
                type: string
              model:
                type: string
              doors:
                type: integer
              bag_capacity:
                type: integer
              seats:
                type: integer
    
    SuppliersRequest:
      type: object
      properties:
        suppliers:
          type: array
          items:
            type: integer
          description: IDs de los proveedores específicos. Si es vacío, retorna todos.
        maximum_results:
          type: integer
        page:
          type: string
    
    SuppliersResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              supplier_id:
                type: integer
              name:
                type: string
    
    CarConstantsRequest:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
        constants:
          type: array
          items:
            type: string
            enum:
            - depot_services
            - fuel_policies
            - fuel_types
            - general
            - payment_timings
            - transmission
    
    CarConstantsResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: object
    
    OrderHoldRequest:
      type: object
      required:
      - vehicle_id
      - search_token
      properties:
        vehicle_id:
          type: string
        search_token:
          type: string
        driver:
          $ref: '#/components/schemas/Driver'
    
    OrderHoldResponse:
      type: object
      properties:
        hold_id:
          type: string
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - HELD
          - FAILED
    
    OrderPreviewRequest:
      type: object
      required:
      - vehicle_id
      - search_token
      properties:
        vehicle_id:
          type: string
        search_token:
          type: string
        hold_id:
          type: string
          description: Si el vehículo fue puesto en Hold previamente, incluir el ID.
        extras:
          type: array
          items:
            type: string
            description: Equipamiento extra (Ej. Silla de bebé, GPS).
    
    OrderPreviewResponse:
      type: object
      properties:
        request_id:
          type: string
        data:
          type: object
          properties:
            order_preview_id:
              type: string
            total_price:
              type: number
            currency:
              type: string
            breakdown:
              type: object
    
    OrderCreateRequest:
      type: object
      required:
      - order_preview_id
      - payment_reference
      - driver_details
      properties:
        order_preview_id:
          type: string
        payment_reference:
          type: string
        driver_details:
          type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            email:
              type: string
            phone_number:
              type: string
    
    OrderDetail:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        locator:
          type: string
          description: Equivalente al PNR (Localizador). Es el código alfanumérico de confirmación del proveedor (Ej. HERTZ-X789).
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
          - PENDING
        vehicle_details:
          type: object
        route_details:
          type: object
        total_price:
          type: number
        currency:
          type: string
        creation_date:
          type: string
          format: date-time
        _links:
          type: object
          description: "HATEOAS – Acciones disponibles según el estado de la orden (Ej: self, modify, cancel)"
          additionalProperties:
            type: string
            format: uri
    
    OrderModifyRequest:
      type: object
      properties:
        extras_to_add:
          type: array
          items:
            type: string
        extras_to_remove:
          type: array
          items:
            type: string
        route:
          $ref: '#/components/schemas/Route'
    
    WebhookSubscription:
      type: object
      required:
      - id
      - url
      - events
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
            - CAR_ORDER_CONFIRMED
            - CAR_ORDER_CANCELLED
            - DEPOT_UPDATE
        secret:
          type: string
    
    WebhookPayload:
      type: object
      required:
      - eventId
      - eventType
      - timestamp
      - resourceId
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        resourceId:
          type: string
        data:
          type: object
