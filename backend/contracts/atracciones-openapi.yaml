# Define la versión del estándar OpenAPI que estamos utilizando.
openapi: 3.0.3

# Sección de metadatos de la API
info:
  # El nombre de la API que aparecerá en la documentación generada (Swagger)
  title: API de Atracciones Turísticas
  # Una descripción detallada de lo que hace este microservicio
  description: |
    Microservicio de Atracciones del Marketplace Turístico.
    Gestiona el catálogo de tours (GUIDED_TOUR), paquetes (PACKAGE) y entradas individuales (SINGLE_TICKET),
    la disponibilidad de cupos y el ciclo de vida transaccional completo de las reservas.
    
    Todos los endpoints transaccionales exigen la cabecera `Idempotency-Key` (UUID v4) para
    garantizar operaciones idempotentes y evitar reservas o cancelaciones duplicadas.
    Los errores siguen el estándar RFC 7807 (application/problem+json).

    Modelo de datos: database/01_esquema.sql. Los identificadores públicos de atracciones
    y reservas son UUID (`atr_uuid`, `res_uuid`); `city` es el id de la tabla `ciudad`
    y `operator.id` es `ope_codigo`. Cada reserva genera una orden, su pago y, si el pago
    queda aprobado, su factura.
  # Versión actual de la API
  version: 2.0.0
  license:
    name: Uso académico - Proyecto de Integración de Sistemas

# Lista de servidores donde la API está alojada
servers:
  # URL del entorno local o API Gateway
  - url: /api/v1
    description: API Gateway - Ruta base. Los `_links` HATEOAS de las respuestas ya incluyen este prefijo.

# Categorías visuales para agrupar y organizar los endpoints en la documentación
tags:
  - name: Atracciones - Catálogo
    description: Operaciones de lectura y escritura sobre el catálogo de tours y atracciones
  - name: Atracciones - Reservas
    description: Ciclo de vida transaccional de las reservas (crear, consultar, cancelar)

# Aquí definimos todas las rutas (URLs) de nuestra API
paths:
  
  # Endpoint para buscar atracciones con filtros complejos
  /atracciones/search:
    # Método HTTP POST (Ideal para payloads de búsqueda grandes que exceden límites de URL en GET)
    post:
      operationId: searchAtracciones
      tags:
        - Atracciones - Catálogo
      summary: Búsqueda de atracciones
      security: []
      description: |
        Endpoint público (catálogo) para buscar atracciones en base a fechas, locaciones y filtros.
        Sujeto a rate limiting (429 + `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAtraccionesRequest'
      responses:
        '200':
          description: Resultados de la búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAtraccionesResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
  
  # Endpoint masivo para recuperar datos estáticos y evitar N+1
  /atracciones/details:
    post:
      operationId: getAtraccionesDetails
      tags:
        - Atracciones - Catálogo
      summary: Obtener detalles estáticos de múltiples atracciones (Batch)
      security: []
      description: |
        Endpoint público. Ideal para consultar múltiples IDs (máx. 50) y evitar el problema N+1.
        El contenido del catálogo solo existe en español: `languages` acepta `es` / `es-ec`
        y cualquier otro valor responde 400. `metadata.not_found` lista los IDs inexistentes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailsRequest'
      responses:
        '200':
          description: Detalles de las atracciones solicitadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
  /atracciones/health:
    get:
      operationId: getHealth
      tags:
        - Atracciones - Catálogo
      summary: Healthcheck del microservicio
      security: []
      responses:
        '200':
          description: Servicio de atracciones operativo
        '429':
          $ref: '#/components/responses/ProblemDetails429'
  
  # Endpoints sobre el recurso principal: Colección de Atracciones
  /atracciones:
    # Obtener listado con paginación tradicional (Útil para catálogos simples)
    get:
      operationId: listAtracciones
      tags:
        - Atracciones - Catálogo
      summary: Obtener el listado paginado de atracciones
      description: |
        Público. Con un token que tenga `attractions:write` se habilita el filtro `status`
        para ver también las atracciones inactivas.
      security:
        - {}
        - OAuth2Security:
          - attractions:read
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
        - name: offset
          in: query
          description: Desplazamiento; si se envía tiene prioridad sobre `page`.
          schema:
            type: integer
            minimum: 0
        - name: q
          in: query
          description: Texto a buscar en nombre o ciudad.
          schema:
            type: string
            maxLength: 120
        - name: category
          in: query
          description: Slug de categoría.
          schema:
            type: string
        - name: city
          in: query
          description: Código numérico del destino.
          schema:
            type: integer
        - name: featured
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: operator
          in: query
          description: Código de la empresa operadora.
          schema:
            type: integer
        - name: status
          in: query
          description: Solo con `attractions:write`.
          schema:
            type: string
            enum: [active, inactive, all]
      responses:
        '200':
          description: Listado de atracciones recuperado exitosamente.
          headers:
            X-API-Deprecation-Date:
              schema:
                type: string
              description: Fecha en la que esta versión de la API será deprecada.
            Cache-Control:
              schema:
                type: string
              description: Directivas de caché.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAtraccionResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '429':
          $ref: '#/components/responses/ProblemDetails429'
    post:
      operationId: createAtraccion
      tags:
        - Atracciones - Catálogo
      summary: Registrar una nueva atracción
      security:
        - OAuth2Security:
          - attractions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtraccionRequest'
      responses:
        '201':
          description: La atracción ha sido creada exitosamente.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtraccionResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
  /atracciones/{id}:
    get:
      operationId: getAtraccion
      tags:
        - Atracciones - Catálogo
      summary: Obtener el detalle de una atracción
      description: |
        Público. Con un token que tenga `attractions:write` también se pueden consultar atracciones inactivas.
      security:
        - {}
        - OAuth2Security:
          - attractions:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la atracción.
          headers:
            X-API-Deprecation-Date:
              schema:
                type: string
              description: Fecha en la que esta versión de la API será deprecada.
            Cache-Control:
              schema:
                type: string
              description: Directivas de caché.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtraccionResponse'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
    put:
      operationId: replaceAtraccion
      tags:
        - Atracciones - Catálogo
      summary: Reemplazar datos completos de una atracción
      security:
        - OAuth2Security:
          - attractions:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAtraccionRequest'
      responses:
        '204':
          description: Reemplazo exitoso sin contenido de respuesta.
        '400':
          $ref: '#/components/responses/ProblemDetails400'
    patch:
      operationId: updateAtraccion
      tags:
        - Atracciones - Catálogo
      summary: Actualizar parcialmente una atracción
      security:
        - OAuth2Security:
          - attractions:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAtraccionRequest'
      responses:
        '200':
          description: Actualización exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtraccionResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
    delete:
      operationId: deleteAtraccion
      tags:
        - Atracciones - Catálogo
      summary: Eliminar una atracción
      security:
        - OAuth2Security:
          - attractions:write
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Eliminación exitosa sin contenido.
        '404':
          $ref: '#/components/responses/ProblemDetails404'
  
  # Consultar disponibilidad de fechas o franjas horarias
  /atracciones/{id}/availability:
    get:
      operationId: getAvailability
      tags:
        - Atracciones - Catálogo
      summary: Consultar disponibilidad de cupos
      security:
        - OAuth2Security:
          - attractions:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Disponibilidad recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
  
  # Endpoint transaccional de creación de orden/reserva
  /atracciones/{id}/reservations:
    post:
      operationId: createReservation
      tags:
        - Atracciones - Reservas
      summary: Crear una reserva de la atracción
      # Requiere autenticación y el scope de escritura
      security:
        - OAuth2Security:
          - attractions:book
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        # Previene que un fallo de red resulte en compras dobles
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: Reserva confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
  /atracciones/reservations/{reservationId}/cancel:
    post:
      operationId: cancelReservation
      tags:
        - Atracciones - Reservas
      summary: Cancelar una reserva
      security:
        - OAuth2Security:
          - attractions:cancel
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Cancelación procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
  /atracciones/reservations:
    get:
      operationId: listReservations
      tags:
        - Atracciones - Reservas
      summary: Historial de reservas del usuario
      security:
        - OAuth2Security:
          - attractions:read
      responses:
        '200':
          description: Listado de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationResponse'
  /atracciones/reservations/{reservationId}:
    get:
      operationId: getReservation
      tags:
        - Atracciones - Reservas
      summary: Obtener detalle de una reserva
      security:
        - OAuth2Security:
          - attractions:read
      parameters:
        - name: reservationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de reserva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResponse'
        '404':
          $ref: '#/components/responses/ProblemDetails404'

# Componentes reutilizables. Aquí definimos moldes para no repetir código.
components:
  
  # Moldes de Seguridad
  securitySchemes:
    # Definimos cómo funciona el OAuth2 para atracciones
    OAuth2Security:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.booking-hub.com/oauth2/authorize
          tokenUrl: https://auth.booking-hub.com/oauth2/token
          scopes:
            attractions:read: Leer catálogo, detalles y reservas propias
            attractions:book: Hacer reservas
            attractions:cancel: Cancelar reservas propias (o de su empresa, si es operador)
            attractions:write: Crear y mantener inventario
            attractions:manage: Gestionar reservas y fechas bloqueadas (confirmar, bloquear días)
            attractions:webhooks: Gestionar webhooks
            admin:full: Administración total (usuarios, operadores, reportes globales)
  
  # Moldes de Respuestas de Error estandarizadas
  responses:
    ProblemDetails400:
      description: Petición inválida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails404:
      description: No encontrado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails409:
      description: Conflicto o error de idempotencia
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ProblemDetails429:
      description: Demasiadas solicitudes (límite por IP). Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  
  # Moldes de Datos (Schemas). Definimos los JSON exactos que viajan en las peticiones.
  schemas:
    # Esquema estándar para reportar errores detallados (RFC 7807)
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    Price:
      type: object
      properties:
        currency:
          type: string
          example: USD
        total:
          type: number
          example: 45.0
    Coordinates:
      type: object
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
    Location:
      type: object
      properties:
        address:
          type: string
        city:
          type: integer
          description: Id de la ciudad (tabla ciudad; ver GET /destinos)
        country:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        type:
          type: string
    Photo:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        alt:
          type: string
          maxLength: 200
          description: Texto alternativo (WCAG 1.1.1). Si se omite se genera a partir del nombre.
    Operator:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: "Quito Tour Bus"
    Rating:
      type: object
      properties:
        number_of_reviews:
          type: integer
        score:
          type: number
          format: float
    Url:
      type: object
      properties:
        web:
          type: string
          format: uri
        app:
          type: string
          format: uri
    DetailsRequest:
      type: object
      required:
        - attractions
      properties:
        attractions:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        languages:
          type: array
          description: Idiomas del contenido. El catálogo solo está en español.
          items:
            type: string
            enum: [es, es-ec]
    DetailsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionResponse'
        metadata:
          type: object
          properties:
            total_results:
              type: integer
            not_found:
              type: array
              items:
                type: string
                format: uuid
            language:
              type: string
              example: es
    SearchAtraccionesRequest:
      type: object
      properties:
        currency:
          type: string
          example: EUR
        cities:
          type: array
          items:
            type: integer
        countries:
          type: array
          items:
            type: string
        dates:
          type: object
          properties:
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        filters:
          type: object
          properties:
            rating:
              type: object
              properties:
                minimum_review_score:
                  type: number
                  format: float
                minimum_review_count:
                  type: integer
        next_page:
          type: string
          description: Token opaco de paginación
        rows:
          type: integer
          example: 20
        sort:
          type: object
          properties:
            by:
              type: string
              example: most_popular
    SearchAtraccionesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionResponse'
        metadata:
          type: object
          properties:
            total_results:
              type: integer
            next_page:
              type: string
              description: Token opaco para obtener la siguiente página
        request_id:
          type: string
    CreateAtraccionRequest:
      type: object
      properties:
        name:
          type: string
        long_description:
          type: string
        duration:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        categories:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        operator:
          $ref: '#/components/schemas/Operator'
        product_type:
          type: string
          enum:
            - SINGLE_TICKET
            - GUIDED_TOUR
            - PACKAGE
        includes:
          type: array
          items:
            type: string
        supported_languages:
          type: array
          items:
            type: string
        free_cancellation:
          type: boolean
    UpdateAtraccionRequest:
      description: |
        Actualización parcial: mismos campos que `CreateAtraccionRequest`, todos opcionales.
        Solo se modifican los campos enviados.
      allOf:
        - $ref: '#/components/schemas/CreateAtraccionRequest'
    AtraccionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        long_description:
          type: string
        duration:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        categories:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        operator:
          $ref: '#/components/schemas/Operator'
        product_type:
          type: string
          enum:
            - SINGLE_TICKET
            - GUIDED_TOUR
            - PACKAGE
        includes:
          type: array
          items:
            type: string
        supported_languages:
          type: array
          items:
            type: string
        free_cancellation:
          type: boolean
        ratings:
          $ref: '#/components/schemas/Rating'
        url:
          $ref: '#/components/schemas/Url'
        _links:
          $ref: '#/components/schemas/Links'
    Links:
      type: object
      description: |
        Enlaces HATEOAS. `href` es una ruta absoluta respecto al host e incluye ya el
        prefijo `/api/v1` (no debe resolverse contra `servers.url`).
      additionalProperties:
        type: object
        properties:
          href:
            type: string
            example: /api/v1/atracciones/123e4567-e89b-42d3-a456-426614174000
          method:
            type: string
            enum: [GET, POST, PUT, PATCH, DELETE]
    PaginatedAtraccionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionResponse'
        meta:
          type: object
          properties:
            totalItems:
              type: integer
            itemCount:
              type: integer
            itemsPerPage:
              type: integer
            totalPages:
              type: integer
            currentPage:
              type: integer
    AvailabilityResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        available_spots:
          type: integer
        times:
          type: array
          items:
            type: string
    ReservationRequest:
      type: object
      required:
        - date
        - ticket_count
        - customer_name
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Obligatoria si la atracción tiene más de un horario.
        ticket_count:
          type: integer
          minimum: 1
          maximum: 30
        customer_name:
          type: string
          minLength: 3
          maxLength: 120
        customer_email:
          type: string
          description: Informativo; la reserva queda a nombre del usuario autenticado.
        children:
          type: integer
          minimum: 0
          maximum: 30
          description: Cuántos de los tickets son de niño (tarifa NINO).
        customer_phone:
          type: string
          pattern: '^(09\d{8}|0[2-7]\d{7})$'
          example: '0991234567'
          description: Teléfono ecuatoriano (dom_telefono) — celular 09XXXXXXXX o fijo 0[2-7]XXXXXXX.
        customer_document:
          type: string
          pattern: '^\d{10}$'
          example: '1710034065'
          description: Cédula ecuatoriana (dom_documento) — 10 dígitos, provincia 01-24/30 y dígito verificador módulo 10. Se guarda en reserva_pasajero.
        payment_method:
          type: string
          enum: [TARJETA, TRANSFERENCIA, EN_SITIO]
          default: TARJETA
          description: TARJETA confirma al instante; los demás dejan la reserva PENDING hasta verificar el pago.
        card:
          $ref: '#/components/schemas/CardInfo'
        notes:
          type: string
          maxLength: 500
    CardInfo:
      type: object
      description: |
        Datos NO sensibles de la tarjeta (PCI-DSS). Nunca se envía el número completo
        ni el CVV. Solo con payment_method TARJETA.
      required: [brand, last4, holder, exp_month, exp_year]
      properties:
        brand:
          type: string
          enum: [VISA, MASTERCARD, AMEX, DINERS, OTRA]
        last4:
          type: string
          pattern: '^\d{4}$'
        holder:
          type: string
        exp_month:
          type: integer
          minimum: 1
          maximum: 12
        exp_year:
          type: integer
    ReservationResponse:
      type: object
      properties:
        reservation_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CONFIRMED, PENDING, CANCELLED]
        ticket_count:
          type: integer
        total_price:
          $ref: '#/components/schemas/Price'
        code:
          type: string
          example: DEC-7F3K9Q
        date:
          type: string
          format: date
        time:
          type: string
        adults:
          type: integer
        children:
          type: integer
        payment_method:
          type: string
          enum: [TARJETA, TRANSFERENCIA, EN_SITIO]
        can_cancel:
          type: boolean
          description: Si el cliente todavía puede cancelarla (con o sin reembolso; ver cancellation_policy).
        cancellation_policy:
          type: string
          enum: [FULL_REFUND, NO_CHARGE, NO_REFUND, NOT_ALLOWED]
          description: >-
            Qué pasa si el cliente cancela ahora. FULL_REFUND reembolso total (dentro del plazo de la
            experiencia o en la hora de arrepentimiento tras reservar); NO_CHARGE pendiente de pago, nada
            que devolver (hasta 1 hora antes de la salida); NO_REFUND puede cancelar pero sin reembolso; NOT_ALLOWED la experiencia ya empezó.
        refundable:
          type: boolean
          description: Si cancelar ahora no tiene costo para el cliente.
        free_cancellation_until:
          type: string
          format: date-time
          description: Hasta cuándo es gratis cancelar (solo con FULL_REFUND o NO_CHARGE).
        _links:
          $ref: '#/components/schemas/Links'
    CancelReservationRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Razón de la cancelación
        accept_no_refund:
          type: boolean
          default: false
          description: Obligatorio (true) cuando cancellation_policy = NO_REFUND; sin él la API responde 409 NO_REFUND_CONFIRMATION_REQUIRED.

