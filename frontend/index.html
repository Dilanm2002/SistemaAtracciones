<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- MOV-008/MOV-017: el contenido usa el área segura (env()) y el teclado virtual redimensiona la página -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Descubre EC: reserva tours, entradas y experiencias en Ecuador. Galápagos, Andes, Amazonía y Costa con guías locales y cancelación gratuita." />
    <meta name="theme-color" content="#0F766E" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://descubre-ec.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- MOV-007: icono y modo app al añadir a la pantalla de inicio en iPhone -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Descubre EC" />

    <!-- Open Graph / Twitter: vista previa al compartir en redes (WEB-001) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Descubre EC" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="Descubre EC · Tours y experiencias en Ecuador" />
    <meta property="og:description" content="Reserva tours, entradas y experiencias en Galápagos, los Andes, la Amazonía y la Costa con guías locales y cancelación gratuita." />
    <meta property="og:url" content="https://descubre-ec.vercel.app/" />
    <meta property="og:image" content="https://descubre-ec.vercel.app/img/og-cotopaxi-1200.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Volcán Cotopaxi cubierto de nieve sobre el páramo andino" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Descubre EC · Tours y experiencias en Ecuador" />
    <meta name="twitter:description" content="Reserva tours, entradas y experiencias en los cuatro mundos del Ecuador." />
    <meta name="twitter:image" content="https://descubre-ec.vercel.app/img/og-cotopaxi-1200.jpg" />

    <!-- MOV-011: fuentes autoalojadas (sin hoja externa que bloquee); se precarga solo la del texto -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/open-sans-latin-wght.woff2" crossorigin />
    <!-- MOV-001: el hero en el ancho justo para cada pantalla (el pre-renderizado la quita fuera del inicio) -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high" data-hero
      imagesrcset="/src/assets/img/hero-640.avif 640w, /src/assets/img/hero-960.avif 960w, /src/assets/img/hero-1280.avif 1280w, /src/assets/img/hero-1920.avif 1920w"
      imagesizes="100vw" />
    <title>Descubre EC · Tours y experiencias en Ecuador</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
