asyncapi: 2.6.0
id: urn:ec:descubre:eventbus
info:
  title: Event Bus de Descubre EC (microservicios)
  version: 2.0.0
  description: |
    Todos los eventos del bus RabbitMQ (docs/ARQUITECTURA-MICROSERVICIOS.md §5).

    - *Exchange* `atracciones.eventos`, tipo `topic`, durable. La *routing key* es el `type` del evento.
    - Una cola *quorum* por consumidor (`reservas.eventos`, `stock.eventos`, `facturacion.eventos`,
      `pagos.eventos`, `clientes.eventos`, `productos.eventos`, `booking.eventos`), con DLX
      `atracciones.eventos.dlx` tras 5 reintentos (1, 2, 4, 8, 16 s).
    - Se publica desde el *outbox* de cada servicio con *publisher confirms*; se consume con *inbox* (dedupe por `id`).

    **Compatibilidad:** los 10 eventos de `backend/contracts/atracciones-asyncapi.yaml` conservan nombre y campos;
    aquí solo se agregan campos opcionales (`correlation_id`, `producer`, y los del modelo canónico del turno).
    Los eventos marcados *nuevo* son internos entre microservicios.

    **Datos personales:** ningún evento lleva nombre, documento, correo ni teléfono. La factura viaja con su
    **encabezado y su detalle (líneas)**, pero los datos del cliente se piden a Facturación por gRPC.
  contact: { name: Equipo de integración Descubre EC }
  license:
    name: Uso académico - Proyecto de Integración de Sistemas
tags:
  - name: atracciones
  - name: saga-compra
  - name: facturacion
defaultContentType: application/json

servers:
  desarrollo:
    url: amqp://localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ local (docker compose)
  marketplace:
    url: amqp://eventbus.booking-hub.internal:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: Event Bus compartido con Booking (cola booking.eventos enlazada a atracciones.#)

channels:
  # ── Productos ──────────────────────────────────────────────────────────
  atracciones.atraccion.publicada:
    description: 'Productos → Stock (crea el inventario), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onAtraccionPublicada
      message: { $ref: '#/components/messages/AtraccionPublicada' }
  atracciones.atraccion.actualizada:
    description: 'Productos → Stock (aforo por horario), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onAtraccionActualizada
      message: { $ref: '#/components/messages/AtraccionActualizada' }
  atracciones.atraccion.retirada:
    description: 'Productos → Stock (cierra fechas), Reservas (avisa a clientes), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onAtraccionRetirada
      message: { $ref: '#/components/messages/AtraccionRetirada' }
  # ── Reservas ───────────────────────────────────────────────────────────
  atracciones.reserva.creada:
    description: 'Reservas → Facturación (prepara), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onReservaCreada
      message: { $ref: '#/components/messages/ReservaCreada' }
  atracciones.reserva.confirmada:
    description: 'Reservas → Stock (retención → vendido), Facturación (emite), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onReservaConfirmada
      message: { $ref: '#/components/messages/ReservaConfirmada' }
  atracciones.reserva.cancelada:
    description: 'Reservas → Stock (libera cupos), Pagos (reembolso si aplica), Facturación (anula), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onReservaCancelada
      message: { $ref: '#/components/messages/ReservaCancelada' }
  atracciones.reserva.checkin:
    description: 'Reservas → Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onReservaCheckin
      message: { $ref: '#/components/messages/ReservaCheckin' }
  # ── Pagos ──────────────────────────────────────────────────────────────
  atracciones.pago.aprobado:
    description: 'Pagos → Reservas (confirma), Facturación, Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onPagoAprobado
      message: { $ref: '#/components/messages/PagoAprobado' }
  atracciones.pago.rechazado:
    description: 'Nuevo · Pagos → Reservas (compensa la saga)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onPagoRechazado
      message: { $ref: '#/components/messages/PagoRechazado' }
  atracciones.pago.expirado:
    description: 'Nuevo · Pagos → Reservas (cancela), Stock (libera la retención)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onPagoExpirado
      message: { $ref: '#/components/messages/PagoExpirado' }
  atracciones.pago.reembolsado:
    description: 'Pagos → Reservas, Facturación (nota de crédito), Booking'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onPagoReembolsado
      message: { $ref: '#/components/messages/PagoReembolsado' }
  # ── Stock ──────────────────────────────────────────────────────────────
  atracciones.stock.actualizado:
    description: 'Stock → Booking (además va por gRPC PushStockUpdate)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onStockActualizado
      message: { $ref: '#/components/messages/StockActualizado' }
  atracciones.stock.retenido:
    description: 'Nuevo · Stock → Reservas'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onStockRetenido
      message: { $ref: '#/components/messages/StockRetenido' }
  atracciones.stock.liberado:
    description: 'Nuevo · Stock → Reservas (la retención venció o se compensó)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onStockLiberado
      message: { $ref: '#/components/messages/StockLiberado' }
  # ── Facturación ────────────────────────────────────────────────────────
  atracciones.factura.emitida:
    description: 'Nuevo · Facturación → Reservas (adjunta el número), notificaciones. Lleva el encabezado y TODO el detalle.'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onFacturaEmitida
      message: { $ref: '#/components/messages/FacturaEmitida' }
  atracciones.factura.anulada:
    description: 'Nuevo · Facturación → Reservas, notificaciones. El detalle se conserva y viaja igual.'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onFacturaAnulada
      message: { $ref: '#/components/messages/FacturaAnulada' }
  # ── Usuarios y Clientes ────────────────────────────────────────────────
  atracciones.usuario.registrado:
    description: 'Nuevo · Usuarios → Clientes (crea la ficha), Reservas'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onUsuarioRegistrado
      message: { $ref: '#/components/messages/UsuarioRegistrado' }
  atracciones.usuario.actualizado:
    description: 'Nuevo · Usuarios → Clientes, Reservas'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onUsuarioActualizado
      message: { $ref: '#/components/messages/UsuarioActualizado' }
  atracciones.cliente.actualizado:
    description: 'Nuevo · Clientes → Reservas, Facturación (refrescan su copia pidiendo los datos por API)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onClienteActualizado
      message: { $ref: '#/components/messages/ClienteActualizado' }
  atracciones.operador.aprobado:
    description: 'Nuevo · Clientes → Productos (habilita publicar)'
    bindings: { amqp: { $ref: '#/components/channelBindings/Topic' } }
    subscribe:
      operationId: onOperadorAprobado
      message: { $ref: '#/components/messages/OperadorAprobado' }

components:
  channelBindings:
    Topic:
      is: routingKey
      exchange:
        name: atracciones.eventos
        type: topic
        durable: true
        autoDelete: false
        vhost: /
      bindingVersion: 0.2.0

  messageTraits:
    Amqp:
      bindings:
        amqp:
          contentEncoding: utf-8
          deliveryMode: 2
          bindingVersion: 0.2.0
      headers:
        type: object
        properties:
          traceparent: { type: string, description: 'W3C Trace Context (OpenTelemetry)' }

  messages:
    AtraccionPublicada:
      messageId: AtraccionPublicada
      name: atracciones.atraccion.publicada
      title: Atracción publicada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoAtraccion' }
    AtraccionActualizada:
      messageId: AtraccionActualizada
      name: atracciones.atraccion.actualizada
      title: Atracción actualizada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoAtraccion' }
    AtraccionRetirada:
      messageId: AtraccionRetirada
      name: atracciones.atraccion.retirada
      title: Atracción retirada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - type: object
            properties:
              data:
                type: object
                required: [attraction_id]
                properties:
                  attraction_id: { type: string, format: uuid }
    ReservaCreada:
      messageId: ReservaCreada
      name: atracciones.reserva.creada
      title: Reserva creada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoReserva' }
    ReservaConfirmada:
      messageId: ReservaConfirmada
      name: atracciones.reserva.confirmada
      title: Reserva confirmada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoReserva' }
    ReservaCancelada:
      messageId: ReservaCancelada
      name: atracciones.reserva.cancelada
      title: Reserva cancelada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/EventoReserva'
          - type: object
            properties:
              data:
                type: object
                properties:
                  reason: { type: string }
                  refunded: { type: boolean }
                  requester: { type: string, enum: [CLIENTE, SAGA_ORCHESTRATOR, ADMIN, OPERADOR] }
    ReservaCheckin:
      messageId: ReservaCheckin
      name: atracciones.reserva.checkin
      title: Check-in presencial realizado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/EventoReserva'
          - type: object
            properties:
              data:
                type: object
                properties:
                  guide_code: { type: string }
    PagoAprobado:
      messageId: PagoAprobado
      name: atracciones.pago.aprobado
      title: Pago aprobado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoPago' }
    PagoRechazado:
      messageId: PagoRechazado
      name: atracciones.pago.rechazado
      title: Pago rechazado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/EventoPago'
          - type: object
            properties:
              data:
                type: object
                properties:
                  reject_reason: { type: string, examples: [FONDOS_INSUFICIENTES, TARJETA_BLOQUEADA, ERROR_SISTEMA] }
    PagoExpirado:
      messageId: PagoExpirado
      name: atracciones.pago.expirado
      title: Pago expirado (sin respuesta del sistema externo dentro de la ventana)
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoPago' }
    PagoReembolsado:
      messageId: PagoReembolsado
      name: atracciones.pago.reembolsado
      title: Pago reembolsado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/EventoPago'
          - type: object
            properties:
              data:
                type: object
                required: [refund_amount]
                properties:
                  refund_amount: { type: number, description: 'Se mantiene numérico por compatibilidad con el contrato público' }
                  refund_number: { type: string }
                  refund_reason: { type: string, enum: [CANCELACION_CLIENTE, CANCELACION_OPERADOR, PAGO_TARDIO, ADMIN] }
    StockActualizado:
      messageId: StockActualizado
      name: atracciones.stock.actualizado
      title: Stock de un turno actualizado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - type: object
            properties:
              data: { $ref: '#/components/schemas/DatosTurno' }
    StockRetenido:
      messageId: StockRetenido
      name: atracciones.stock.retenido
      title: Cupos retenidos
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoRetencion' }
    StockLiberado:
      messageId: StockLiberado
      name: atracciones.stock.liberado
      title: Cupos liberados
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoRetencion' }
    FacturaEmitida:
      messageId: FacturaEmitida
      name: atracciones.factura.emitida
      title: Factura emitida (encabezado + detalle)
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoFactura' }
      examples:
        - name: dos-adultos-un-nino
          payload:
            id: 4c1e8a52-7d0b-4f0e-9a51-2a3d7c9b1e10
            sequence: '2210'
            type: atracciones.factura.emitida
            version: 1
            aggregate: factura
            aggregate_id: 9f6c2a10-3b4d-4e5f-8a9b-0c1d2e3f4a5b
            occurred_at: '2026-10-20T14:05:03Z'
            correlation_id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
            producer: ms-facturacion
            data:
              invoice_number: FAC-001-001-000000123
              order_number: ORD-7F3K9Q
              payment_number: PAG-7F3K9Q
              customer_id: 0b9e7c6a-5d4f-4e3a-9b2c-1a0f9e8d7c6b
              status: EMITIDA
              currency: USD
              subtotal: '91.74'
              discount: '0.00'
              tax: '13.76'
              total: '105.50'
              issued_at: '2026-10-20T14:05:03Z'
              lines:
                - { line: 1, code: ATR-12-AD, description: 'Tour Quilotoa · 2026-10-25 09:00 · Adulto', quantity: 2, unit_price: '35.00', discount: '0.00', taxable_base: '70.00', tax_rate: '15.00', tax_amount: '10.50', total: '80.50', ticket_type: ADULTO }
                - { line: 2, code: ATR-12-NI, description: 'Tour Quilotoa · 2026-10-25 09:00 · Niño', quantity: 1, unit_price: '21.74', discount: '0.00', taxable_base: '21.74', tax_rate: '15.00', tax_amount: '3.26', total: '25.00', ticket_type: NINO }
    FacturaAnulada:
      messageId: FacturaAnulada
      name: atracciones.factura.anulada
      title: Factura anulada (con su detalle)
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/EventoFactura'
          - type: object
            properties:
              data:
                type: object
                required: [voided_at, void_reason]
                properties:
                  voided_at: { type: string, format: date-time }
                  void_reason: { type: string }
    UsuarioRegistrado:
      messageId: UsuarioRegistrado
      name: atracciones.usuario.registrado
      title: Usuario registrado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoUsuario' }
    UsuarioActualizado:
      messageId: UsuarioActualizado
      name: atracciones.usuario.actualizado
      title: Usuario actualizado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload: { $ref: '#/components/schemas/EventoUsuario' }
    ClienteActualizado:
      messageId: ClienteActualizado
      name: atracciones.cliente.actualizado
      title: Ficha del cliente actualizada
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - type: object
            properties:
              data:
                type: object
                required: [user_id, changed]
                properties:
                  user_id: { type: string, format: uuid }
                  changed: { type: array, items: { type: string, enum: [DOCUMENTO, RAZON_SOCIAL, DIRECCION, TELEFONO] } }
    OperadorAprobado:
      messageId: OperadorAprobado
      name: atracciones.operador.aprobado
      title: Operador aprobado
      traits: [{ $ref: '#/components/messageTraits/Amqp' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/Sobre'
          - type: object
            properties:
              data:
                type: object
                required: [operator_id, user_ids]
                properties:
                  operator_id: { type: integer, description: ope_codigo }
                  user_ids: { type: array, items: { type: string, format: uuid } }

  schemas:
    EventoRetencion:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: object
              required: [retention_id, order_number, slot_id, units, status]
              properties:
                retention_id: { type: string, format: uuid }
                order_number: { type: string }
                attraction_id: { type: string, format: uuid }
                slot_id: { type: string }
                units: { type: integer, minimum: 1 }
                status: { type: string, enum: [RETENIDA, LIBERADA, VENCIDA] }
                expires_at: { type: string, format: date-time }
                revision: { type: integer }
    EventoUsuario:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: object
              required: [user_id, roles, active]
              description: Sin correo ni nombre; Clientes los pide a Usuarios por API
              properties:
                user_id: { type: string, format: uuid }
                roles: { type: array, items: { type: string, enum: [CLIENTE, OPERADOR, ADMIN] } }
                active: { type: boolean }
                provider: { type: string, enum: [LOCAL, GOOGLE] }
    Sobre:
      type: object
      description: Sobre común (§5.1). Igual al del contrato público + correlation_id y producer.
      required: [id, sequence, type, version, aggregate, aggregate_id, occurred_at, data]
      properties:
        id: { type: string, format: uuid, description: 'Dedupe en el inbox del consumidor' }
        sequence: { type: string, description: 'Orden dentro del servicio que lo emite' }
        type: { type: string, pattern: '^atracciones\.[a-z]+\.[a-z]+$' }
        version: { type: integer, minimum: 1 }
        aggregate: { type: string, enum: [reserva, atraccion, pago, stock, factura, usuario, cliente, operador] }
        aggregate_id: { type: string }
        occurred_at: { type: string, format: date-time }
        correlation_id: { type: string, description: 'X-Request-Id de la petición original (sigue una compra entre servicios)' }
        producer: { type: string, enum: [ms-usuarios, ms-clientes, ms-productos, ms-stock, ms-reservas, ms-pagos, ms-facturacion] }
        data: { type: object }
    Decimal:
      type: string
      pattern: '^-?\d+\.\d{2}$'
    EventoAtraccion:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: object
              required: [attraction_id, status]
              properties:
                attraction_id: { type: string, format: uuid }
                name: { type: string }
                status: { type: string, enum: [BORRADOR, PUBLICADA, INACTIVA] }
                city_id: { type: integer }
                operator_id: { type: integer }
                price:
                  type: object
                  properties:
                    currency: { type: string }
                    total: { type: number }
                changed: { type: array, items: { type: string, enum: [DATOS, TARIFA, HORARIO, FOTOS, ESTADO] } }
    EventoReserva:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: object
              description: Sin datos personales (campos del contrato público + los del contrato v2)
              required: [reservation_id, code, status, attraction_id, order_number]
              properties:
                reservation_id: { type: string, format: uuid }
                code: { type: string }
                status: { type: string, enum: [CONFIRMADA, PENDIENTE_PAGO, CANCELADA_RES, COMPLETADA] }
                attraction_id: { type: string, format: uuid }
                operator_id: { type: integer }
                city_id: { type: integer }
                slot_id: { type: string }
                date: { type: string, format: date }
                time: { type: string }
                time_24h: { type: string }
                adults: { type: integer }
                children: { type: integer }
                seniors: { type: integer }
                students: { type: integer }
                infants: { type: integer }
                ticket_count: { type: integer }
                total:
                  type: object
                  properties:
                    currency: { type: string }
                    total: { type: number }
                payment_method: { type: string, enum: [TARJETA, TRANSFERENCIA, EN_SITIO, SOA_BOOKING_GATEWAY] }
                order_number: { type: string }
                saga_id: { type: string, format: uuid }
    EventoPago:
      description: Datos de la reserva (como en el contrato público, que Booking ya consume) + datos del pago.
      allOf:
        - $ref: '#/components/schemas/EventoReserva'
        - type: object
          properties:
            data:
              type: object
              required: [payment_number, order_number, amount, method, result, timing]
              properties:
                payment_number: { type: string }
                order_number: { type: string }
                reservation_id: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/Decimal' }
                currency: { type: string }
                method: { type: string, enum: [TARJETA, TRANSFERENCIA, EN_SITIO, SOA_BOOKING_GATEWAY] }
                result: { type: string, enum: [APROBADO, RECHAZADO, EXPIRADO, ERROR_SISTEMA] }
                verified_manually: { type: boolean }
                timing: { $ref: '#/components/schemas/TiemposPago' }
    TiemposPago:
      type: object
      description: Tiempos medidos (pag_* de pagos.pago). Nunca datos de tarjeta.
      required: [requested_at, attempts]
      properties:
        requested_at: { type: string, format: date-time, description: pag_solicitado_en }
        sent_at: { type: [string, 'null'], format: date-time, description: pag_enviado_en }
        responded_at: { type: [string, 'null'], format: date-time, description: pag_respondido_en }
        duration_ms: { type: [integer, 'null'], description: pag_duracion_ms }
        total_duration_ms: { type: [integer, 'null'], description: pag_duracion_total_ms }
        attempts: { type: integer, minimum: 0, description: pag_intentos }
    DatosTurno:
      type: object
      description: Modelo canónico del turno (docs/CONTRATO-SCHEMA-FIRST.md §4). `time` se mantiene por compatibilidad.
      required: [attraction_id, date, available_units, total_units]
      properties:
        attraction_id: { type: string, format: uuid }
        slot_id: { type: string, pattern: '^slot-\d{8}-\d{4}$' }
        date: { type: string, format: date }
        time: { type: string, examples: ['10:30'] }
        time_24h: { type: string, pattern: '^\d{2}:\d{2}$' }
        timezone: { type: string, default: America/Guayaquil }
        available_units: { type: integer, minimum: 0 }
        total_units: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 0 }
        reason: { type: string, enum: [VENTA, CANCELACION, AFORO, RETENCION, LIBERACION, BLOQUEO] }
    LineaFactura:
      type: object
      description: |
        Una línea de factura_detalle (mismo contenido que LineaFactura de facturacion.proto).
        taxable_base = quantity × unit_price − discount; total = taxable_base + tax_amount.
      required: [line, code, description, quantity, unit_price, discount, taxable_base, tax_rate, tax_amount, total]
      properties:
        line: { type: integer, minimum: 1 }
        code: { type: string }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unit_price: { $ref: '#/components/schemas/Decimal' }
        discount: { $ref: '#/components/schemas/Decimal' }
        taxable_base: { $ref: '#/components/schemas/Decimal' }
        tax_rate: { type: string, pattern: '^\d{1,3}\.\d{2}$' }
        tax_amount: { $ref: '#/components/schemas/Decimal' }
        total: { $ref: '#/components/schemas/Decimal' }
        ticket_type: { type: string, enum: [ADULTO, NINO, ADULTO_MAYOR, ESTUDIANTE, INFANTE] }
        order_reference: { type: string }
    EventoFactura:
      allOf:
        - $ref: '#/components/schemas/Sobre'
        - type: object
          properties:
            data:
              type: object
              description: Encabezado + detalle. subtotal = Σ taxable_base; tax = Σ tax_amount; total = Σ total de las líneas.
              required: [invoice_number, order_number, customer_id, status, currency, subtotal, discount, tax, total, issued_at, lines]
              properties:
                invoice_number: { type: string }
                order_number: { type: string }
                payment_number: { type: [string, 'null'] }
                customer_id: { type: string, format: uuid, description: 'usu_id; los datos del cliente se piden a Facturación' }
                status: { type: string, enum: [EMITIDA, ANULADA] }
                currency: { type: string }
                subtotal: { $ref: '#/components/schemas/Decimal' }
                discount: { $ref: '#/components/schemas/Decimal' }
                tax: { $ref: '#/components/schemas/Decimal' }
                total: { $ref: '#/components/schemas/Decimal' }
                issued_at: { type: string, format: date-time }
                sri_access_key: { type: [string, 'null'] }
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/LineaFactura' }
