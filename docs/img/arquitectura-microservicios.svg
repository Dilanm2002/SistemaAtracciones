  <!-- ═══ Leyenda ═══ -->
  <g transform="translate(24,905)" font-size="12" fill="#1f2937">
    <rect width="1552" height="70" fill="#fff" stroke="#d6e1de"/>
    <text x="16" y="24" font-weight="700">Leyenda</text>
    <line x1="16" y1="46" x2="56" y2="46" stroke="#1f2937" stroke-width="2"/><text x="64" y="50">REST (síncrono)</text>
    <line x1="200" y1="46" x2="240" y2="46" stroke="#c62828" stroke-width="2"/><text x="248" y="50">gRPC / eventos / subgrafos</text>
    <line x1="430" y1="46" x2="470" y2="46" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4"/><text x="478" y="50">servicio externo</text>
    <circle cx="630" cy="46" r="8" fill="#fff" stroke="#1f2937" stroke-width="2"/><text x="646" y="50">microservicio</text>
    <text x="790" y="38">Cada servicio tiene su esquema en Supabase PostgreSQL y su propio ORM (Prisma).</text><text x="790" y="56">Ningún servicio lee las tablas de otro: se comunican por el ESB, el Event Bus o GraphQL.</text>
