    <line x1="1260" y1="164" x2="1260" y2="178"/><line x1="1268" y1="164" x2="1268" y2="178"/>
  </g>
  <text x="990" y="196" font-size="10.5" fill="#52615e" text-anchor="middle">exchange atracciones.eventos · colas por servicio · outbox / inbox · DLQ</text>
  <!-- ESB ↔ Event Bus -->
  <line x1="748" y1="385" x2="748" y2="206" stroke="#c62828" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="756" y="300" font-size="11" fill="#c62828">publica / consume</text>

