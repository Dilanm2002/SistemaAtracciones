  <rect x="1100" y="318" width="100" height="350" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
  <line x1="1150" y1="330" x2="1150" y2="656" stroke="#1f2937" stroke-width="2"/>
  <g fill="none" stroke="#1f2937" stroke-width="2">
    <path d="M932,330 L1138,330"/><path d="M932,410 L1138,410"/><path d="M932,490 L1138,490"/><path d="M932,570 L1138,570"/><path d="M932,650 L1138,650"/>
  </g>
