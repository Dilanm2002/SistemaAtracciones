<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI', Arial, sans-serif">
  <title>Arquitectura de microservicios de Descubre EC</title>
  <desc>Bases de datos por esquema en Supabase PostgreSQL, aplicación con ORM y API por servicio, microservicios conectados al ESB con Gateway y JWT, bus de eventos RabbitMQ, subgrafos que convergen en GraphQL y la interfaz web.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="flechaN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <g id="cilindro">
      <rect x="0" y="8" width="150" height="54" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
      <ellipse cx="75" cy="8" rx="75" ry="8" fill="#eef6f5" stroke="#1f2937" stroke-width="2"/>
      <path d="M0,62 A75,8 0 0 0 150,62" fill="none" stroke="#1f2937" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="#fbfbf8"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#0f3d38">Descubre EC · Arquitectura SOA con microservicios</text>
  <text x="24" y="58" font-size="14" fill="#52615e">Datos en Supabase PostgreSQL (un esquema por servicio) · ESB con Gateway · Event Bus RabbitMQ · todo converge en GraphQL</text>

  <!-- ═══ Encabezados de columnas ═══ -->
  <g font-size="13" font-weight="700" fill="#52615e" letter-spacing="1">
    <text x="40" y="168">BASE DE DATOS</text>
    <text x="232" y="168">APLICACIÓN</text>
    <text x="430" y="168">MICROSERVICIOS</text>
  </g>

  <!-- ═══ Filas: base de datos → aplicación → microservicio ═══ -->
  <!-- Fila: Usuarios -->
  <g transform="translate(30,190)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">usuarios</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Clientes -->
  <g transform="translate(30,275)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">clientes</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Productos -->
  <g transform="translate(30,360)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">productos</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Stock -->
  <g transform="translate(30,445)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">stock</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Reservas -->
  <g transform="translate(30,530)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">reservas</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Pagos -->
  <g transform="translate(30,615)"><use href="#cilindro"/><text x="75" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">pagos</text><text x="75" y="53" text-anchor="middle" font-size="11" fill="#52615e">Supabase PG</text></g>
  <!-- Fila: Facturación -->
  <g transform="translate(30,700)"><use href="#cilindro"/><text x="75" y="30" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">facturacion</text><text x="75" y="44" text-anchor="middle" font-size="10" fill="#52615e">encabezado · detalle</text><text x="75" y="57" text-anchor="middle" font-size="10" fill="#52615e">Supabase PG</text></g>

  <!-- Aplicaciones (ORM | NestJS | API) -->
  <g font-size="11" fill="#1f2937" text-anchor="middle">
    <g transform="translate(230,192)"><rect width="150" height="60" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#1f2937"/><line x1="105" y1="0" x2="105" y2="60" stroke="#1f2937"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="35" font-weight="700">REST</text></g>
    <g transform="translate(230,277)"><rect width="150" height="60" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#1f2937"/><line x1="105" y1="0" x2="105" y2="60" stroke="#1f2937"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="35" font-weight="700">REST</text></g>
    <g transform="translate(230,362)"><rect width="150" height="60" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#1f2937"/><line x1="105" y1="0" x2="105" y2="60" stroke="#1f2937"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="29" font-weight="700">REST</text><text x="127" y="44" font-weight="700" fill="#c62828">gRPC</text></g>
    <g transform="translate(230,447)"><rect width="150" height="60" fill="#fff" stroke="#c62828" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#c62828"/><line x1="105" y1="0" x2="105" y2="60" stroke="#c62828"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="35" font-weight="700" fill="#c62828">gRPC</text></g>
    <g transform="translate(230,532)"><rect width="150" height="60" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#1f2937"/><line x1="105" y1="0" x2="105" y2="60" stroke="#1f2937"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="29" font-weight="700">REST</text><text x="127" y="44" font-weight="700" fill="#c62828">gRPC</text></g>
    <g transform="translate(230,617)"><rect width="150" height="60" fill="#fff" stroke="#1f2937" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#1f2937"/><line x1="105" y1="0" x2="105" y2="60" stroke="#1f2937"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="29" font-weight="700">REST</text><text x="127" y="44" font-size="9">interna</text></g>
    <g transform="translate(230,702)"><rect width="150" height="60" fill="#fff" stroke="#c62828" stroke-width="2"/><line x1="40" y1="0" x2="40" y2="60" stroke="#c62828"/><line x1="105" y1="0" x2="105" y2="60" stroke="#c62828"/><text x="20" y="27">ORM</text><text x="20" y="42" font-size="9">Prisma</text><text x="72" y="35">NestJS</text><text x="127" y="35" font-weight="700" fill="#c62828">gRPC</text></g>
  </g>
  <!-- BD → Aplicación -->
  <g stroke="#1f2937" stroke-width="2">
    <line x1="180" y1="225" x2="230" y2="222"/><line x1="180" y1="310" x2="230" y2="307"/><line x1="180" y1="395" x2="230" y2="392"/>
    <line x1="180" y1="480" x2="230" y2="477"/><line x1="180" y1="565" x2="230" y2="562"/><line x1="180" y1="650" x2="230" y2="647"/><line x1="180" y1="735" x2="230" y2="732"/>
  </g>

  <!-- Microservicios (círculos) -->
  <g stroke="#1f2937" stroke-width="2" fill="#fff">
    <line x1="380" y1="222" x2="436" y2="222"/><circle cx="450" cy="222" r="14"/>
    <line x1="380" y1="307" x2="436" y2="307"/><circle cx="450" cy="307" r="14"/>
    <line x1="380" y1="392" x2="436" y2="392"/><circle cx="450" cy="392" r="14"/>
    <line x1="380" y1="477" x2="436" y2="477" stroke="#c62828"/><circle cx="450" cy="477" r="14" stroke="#c62828"/>
    <line x1="380" y1="562" x2="436" y2="562"/><circle cx="450" cy="562" r="14"/>
    <line x1="380" y1="647" x2="436" y2="647"/><circle cx="450" cy="647" r="14"/>
    <line x1="380" y1="732" x2="436" y2="732" stroke="#c62828"/><circle cx="450" cy="732" r="14" stroke="#c62828"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1f2937">
    <text x="472" y="215">MS G. Usuarios</text><text x="472" y="232" font-size="11" font-weight="400" fill="#52615e">login · roles · emite JWT</text>
    <text x="472" y="300">MS G. Clientes</text><text x="472" y="317" font-size="11" font-weight="400" fill="#52615e">perfil · favoritos · empresas</text>
    <text x="472" y="385">MS G. Productos</text><text x="472" y="402" font-size="11" font-weight="400" fill="#52615e">atracciones · catálogo</text>
    <text x="472" y="470" fill="#c62828">MS Stock · gRPC</text><text x="472" y="487" font-size="11" font-weight="400" fill="#52615e">cupos · retenciones</text>
    <text x="472" y="555">MS G. Reservas</text><text x="472" y="572" font-size="11" font-weight="400" fill="#52615e">orquesta la saga</text>
    <text x="472" y="640">MS G. Pagos</text><text x="472" y="657" font-size="11" font-weight="400" fill="#52615e">mide el tiempo de cada pago</text>
    <text x="472" y="725" fill="#c62828">MS G. Facturación · gRPC</text><text x="472" y="742" font-size="11" font-weight="400" fill="#52615e">encabezado · detalle</text>
  </g>

  <!-- Servicios externos -->
  <g>
    <circle cx="450" cy="120" r="14" fill="#fff" stroke="#1f2937" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="472" y="115" font-size="14" font-weight="700" fill="#1f2937">MS Mapas</text>
    <text x="472" y="132" font-size="11" fill="#52615e">Google Maps / OpenStreetMap</text>
    <circle cx="450" cy="830" r="14" fill="#fff" stroke="#c62828" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="472" y="825" font-size="14" font-weight="700" fill="#c62828">Sistema de pagos · SOA</text>
    <text x="472" y="842" font-size="11" fill="#52615e">servicio externo (SOAP/HTTPS) vía ESB</text>
  </g>

  <!-- ═══ ESB con Gateway ═══ -->
  <text x="728" y="372" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">ESB</text>
  <rect x="680" y="385" width="96" height="290" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="694" y="410" width="68" height="240" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="728" y="535" font-size="15" font-weight="700" fill="#c62828" text-anchor="middle" transform="rotate(-90 728 530)">Gateway</text>
  <text x="728" y="700" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">JWT · DPoP</text>
  <text x="728" y="716" font-size="11" fill="#52615e" text-anchor="middle">enruta · protege · traduce</text>

  <!-- Microservicios → ESB (entradas del gateway) -->
  <g fill="none" stroke-width="2">
    <path d="M640,222 C672,222 662,430 694,430" stroke="#c62828"/>
    <path d="M640,307 C672,307 662,465 694,465" stroke="#c62828"/>
    <path d="M640,392 C672,392 662,500 694,500" stroke="#c62828"/>
    <path d="M640,477 C672,477 662,530 694,530" stroke="#c62828"/>
    <path d="M640,562 L694,560" stroke="#1f2937"/>
    <path d="M640,647 C672,647 662,590 694,590" stroke="#1f2937"/>
    <path d="M645,732 C675,732 662,620 694,620" stroke="#c62828"/>
    <path d="M600,142 C600,300 680,330 712,410" stroke="#1f2937" stroke-dasharray="6 4"/>
    <path d="M660,818 C640,770 650,690 694,650" stroke="#c62828" stroke-dasharray="6 4"/>
  </g>
  <g fill="#fff" stroke="#1f2937" stroke-width="2">
    <circle cx="694" cy="430" r="5"/><circle cx="694" cy="465" r="5"/><circle cx="694" cy="500" r="5"/><circle cx="694" cy="530" r="5"/>
    <circle cx="694" cy="560" r="5"/><circle cx="694" cy="590" r="5"/><circle cx="694" cy="620" r="5"/>
  </g>

  <!-- ═══ Event Bus (RabbitMQ) ═══ -->
  <rect x="640" y="90" width="700" height="110" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
  <text x="990" y="135" font-size="24" fill="#1f2937" text-anchor="middle" font-style="italic">Event Bus <tspan fill="#c62828" font-weight="700">(RabbitMQ)</tspan></text>
  <line x1="650" y1="160" x2="1330" y2="160" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="650" y1="182" x2="1330" y2="182" stroke="#1f2937" stroke-width="1.5"/>
  <g stroke="#1f2937" stroke-width="2">
    <line x1="720" y1="164" x2="720" y2="178"/><line x1="728" y1="164" x2="728" y2="178"/>
    <line x1="820" y1="164" x2="820" y2="178"/><line x1="828" y1="164" x2="828" y2="178"/>
