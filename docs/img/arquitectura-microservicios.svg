  <text x="1475" y="795" font-size="15" font-weight="700" fill="#0f3d38" text-anchor="middle">Booking</text>
  <text x="1475" y="815" font-size="11" fill="#52615e" text-anchor="middle">REST (contrato) + eventos</text>
  <path d="M776,655 L800,655 L800,880 L1475,880 L1475,844" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#flechaN)"/>
  <text x="1080" y="873" font-size="11" fill="#0f766e" text-anchor="middle">REST · contrato OpenAPI por el Gateway</text>
