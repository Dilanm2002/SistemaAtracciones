        code:
          type: string
          description: Código nemotécnico interno para evaluación en código.
          example: "OUT_OF_STOCK"
        correlation_id:
          type: string
          description: Identificador de correlación propagado para rastrear el fallo en los logs y spans de Jaeger.
          example: "cid-8821a"
        timestamp:
          type: string
          format: date-time
          example: "2026-10-21T16:44:01Z"
        invalid_params:
          type: array
          description: Lista de campos con error en caso de fallo de validación HTTP 400/422.
          items:
            type: object
            properties:
              name:
                type: string
                example: "customer.phone"
              reason:
                type: string
                example: "El formato debe ser internacional E.164 o número celular válido de Ecuador (09XXXXXXXX)."

  responses:
    ProblemDetails401:
      description: No autenticado. Cabecera Authorization con token JWT o X-API-Key ausente o inválida (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://descubreec.com/errors/unauthorized"
            title: "No Autorizado"
            status: 401
            detail: "El token JWT no fue provisto, ha expirado o la firma criptográfica es inválida."
            instance: "/api/v3/atracciones/reservas"
            code: "UNAUTHORIZED"
            correlation_id: "cid-auth-01"
            timestamp: "2026-10-24T15:00:00Z"

    ProblemDetails403:
      description: Acceso denegado. El usuario no posee los permisos o roles requeridos (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: "https://descubreec.com/errors/forbidden"
            title: "Acceso Prohibido"
            status: 403
            detail: "No cuenta con el rol de administración o credenciales de socio requeridas para esta acción."
            instance: "/api/v3/atracciones/promociones/contrato"
            code: "FORBIDDEN"
            correlation_id: "cid-auth-02"
            timestamp: "2026-10-24T15:00:00Z"

    ProblemDetails400:
      description: Parámetros inválidos o sintaxis de solicitud incorrecta (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails404:
      description: Recurso no encontrado en el sistema de atracciones (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails409:
      description: Conflicto de estado, colisión de Idempotencia o Cupos Agotados (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails422:
      description: Entidad no procesable (ej. fallo algorítmico en la cédula ecuatoriana).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails500:
      description: Error interno del servidor en la tienda socia (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ProblemDetails503:
      description: Servicio no disponible o circuito abierto temporalmente (RFC 7807).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT emitido conforme al estándar RFC 7519 para autenticación de usuarios y consumo de microservicios (RDA2 Semana 11).  
        Se transmite en la cabecera `Authorization: Bearer <token>`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Clave de API precompartida para comunicación máquina a máquina (M2M) e interconexión segura entre Booking Prototipo y Descubre EC.
