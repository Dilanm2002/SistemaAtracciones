openapi: 3.0.3
info:
  title: API de Integración y Catálogo de Atracciones Turísticas (Booking Prototipo RDA2 — OpenAPI v3 Canónico)
  version: 3.0.0
  description: |
    # Contrato Oficial de Integración v3.0.0 — Vertical de Atracciones Turísticas (RDA2 - Semana 9)
    
    > **Sistema Emisor / Proveedor:** Descubre EC (Sistema de Atracciones Turísticas del Ecuador — Dilan Mendoza)  
    > **Sistema Consumidor / Agregador Central:** Booking Prototipo (Marketplace Multimodal — Paúl Rosero)  
    > **Asignatura:** Integración de Sistemas — 6to Semestre (Reto 2: RDA2)  
    > **Estándar:** OpenAPI Specification 3.0.3 (API-First, REST HATEOAS Nivel 3, RFC 7807 Problem Details)  
    > **Documento de Origen:** `contracts/atracciones-openapi-v2.yaml`  
    > **Fecha de Emisión Oficial:** Octubre 2026  

    ---

    ## 1. Propósito y Alcance del Contrato v2.0.0
    Este contrato formaliza la interfaz de programación de aplicaciones (API) para la **integración bidireccional** entre la tienda externa de Atracciones Turísticas y el agregador **Booking Prototipo**. Provee las especificaciones rigurosas y exhaustivas para que los agentes inteligentes y desarrolladores de cada equipo construyan, validen y consuman los servicios web sin ambigüedades.

    ### Características Principales Implementadas:
    1. **Taxonomía Jerárquica Recursiva de Categorías:** Endpoint `/atracciones/categorias/arbol` con auto-referencia y banderas de inclusiones obligatorias de la cátedra:
       - 🍽️ `incluye_comida`: Degustaciones, refrigerios o almuerzos incluidos.
       - 🚌 `incluye_transporte`: Traslado terrestre ida/vuelta o bus panorámico.
       - 🗣️ `incluye_guia`: Guía acreditado con especificación de idiomas.
    2. **Ficha Técnica Detallada y Enriquecida:** Endpoint `GET /atracciones/{id}` con itinerario cronológico paso a paso, valoraciones desglosadas por pilares (Limpieza, Servicio, Calidad-Precio), punto de encuentro geoespacial (coordenadas GPS) y admisión de animales de servicio.
    3. **Disponibilidad Dinámica de Turnos Horarios (*Time Slots*):** Endpoint `GET /atracciones/{id}/disponibilidad` con aforo remanente en tiempo real (`DISPONIBLE`, `ULTIMOS_CUPOS`, `AGOTADO`).
    4. **Desglose Tarifario por Grupo de Edad:** Cuatro tipos de boleto con tarificación transparente: Adulto, Niño (50% desc.), Senior (tarifa tercera edad) y Bebé/Infante ($0 pero con reserva legal de cupo).
    5. **Contrato Obligatorio de Compra y Sagas Distribuidas:** Endpoint `POST /atracciones/reservas` con respuesta síncrona formal:
       - `201 Created`: Compra exitosa con `external_order_id`, código PNR y voucher QR.
       - `409 Conflict`: **Contrato Obligatorio de Falta de Stock** (`OUT_OF_STOCK`), activando la Saga de compensación en orden inverso (LIFO).
    6. **Check-in Presencial en Punto de Encuentro:** Endpoint `POST /atracciones/reservas/{id}/checkin` para validación física de identidad del titular por el guía turístico antes del abordaje.
    7. **Políticas B2B de Combos y Descuentos:** Endpoint `GET /atracciones/promociones/contrato` que define la aceptación de paquetes turísticos y el porcentaje máximo de descuento comercial.
    8. **Observabilidad, Trazabilidad y Outbox EDA:** Feed de eventos Outbox `/atracciones/eventos`, cabeceras obligatorias `X-Correlation-Id`, `Idempotency-Key` y endpoint de salud `/atracciones/health` para el tablero de monitoreo tipo grafo (🟢 Foco Verde / 🔴 Foco Rojo).

    
    ## 1.1. Resoluciones y Decisiones Oficiales de Arquitectura v3.0.0 (Semana 9)
    Conforme a lo dictado en **Indicaciones semana 9.md** y las consideraciones de integración con los 5 compañeros:
    
    1. **Estandarización 100% en Inglés (Unificación Lingüística):**
       - Se suprimen las duplicidades de campos obligatorios en español. Todos los esquemas canónicos de entrada y salida establecen sus propiedades requeridas en **inglés** (`name`, `short_description`, `price`, `date`, `time`, `slot_id`, `adult_count`, `customer`, etc.).
       - Los atributos en español se conservan como alias opcionales en el backend para máxima tolerancia con código preexistente (*Ley de Postel: Sé estricto en lo que emites, tolerante en lo que recibes*).
    
    2. **Resolución de la Ambigüedad en Checkout (`slot_id` vs `time`):**
       - Se define formalmente que el **`slot_id` es la clave primaria de bloqueo atómico de aforo** en la base de datos (ej. `slot-20261025-1030`).
       - Los campos informativos `date` y `time` deben coincidir con dicho turno. Si el integrador envía un `slot_id` cuya fecha/hora difiere de los campos enviados, Booking rechazará la solicitud inmediatamente con **`400 Bad Request`** (`code: SLOT_TIME_MISMATCH`), garantizando integridad transaccional absoluta.
    
    3. **Contrato Riguroso de Errores para Sagas Distribuidas:**
       - **`400 Bad Request`:** Error sintáctico o inconsistencia (`SLOT_TIME_MISMATCH`, JSON inválido, tipos de datos erróneos).
       - **`422 Unprocessable Entity`:** Error de validación semántica previa (fecha en el pasado, `adult_count < 1`). **No activa compensación de Saga** porque no se inició el cobro.
       - **`409 Conflict` con `code: OUT_OF_STOCK`:** Conflicto concurrente de aforo agotado. **ÚNICO DETONADOR OFICIAL para que el orquestador de Booking dispare la compensación LIFO** (reversar cobros, cancelar vuelos/hoteles asociados).
    
    4. **Asimetría de Comunicación Híbrida (gRPC Inbound vs REST Outbound):**
       - **Tiendas de Atracciones ➔ Booking:** Transmiten variaciones de cupos en tiempo real mediante canal binario **gRPC Inbound** (puerto 50051, contrato `src/proto/inventory.proto`, servicio `inventory.InventoryStockService`).
       - **Booking ➔ Tiendas de Atracciones:** Cuando un usuario final compra en Booking, el ESB despacha la orden mediante **REST Outbound** (`POST /reservas`) a la `baseUrlRest` del socio correspondiente registrada en `schema_proveedores.config_proveedor`.

    ---

    ## 2. Arquitectura de Comunicación Híbrida: REST vs. gRPC (Consideraciones RDA2)
    Conforme a lo exigido en las Consideraciones RDA2 y la Semana 8:
    * **Compras y Transacciones (ÚNICAMENTE REST):** La interacción de usuario, exploración de catálogo, checkout orquestado, check-in presencial, descarga de comprobantes y consultas administrativas se realizan EXCLUSIVAMENTE mediante peticiones HTTP RESTful bajo este contrato OpenAPI v2.
    * **Sincronización de Stock e Inventario (OBLIGATORIAMENTE gRPC sobre HTTP/2 — Puerto 50051):** Las tiendas individuales DEBEN transmitir sus variaciones de cupos y disponibilidad hacia Booking Prototipo a través de un canal gRPC de alto rendimiento, permitiendo ingesta continua en memoria RAM sin sobrecargar la base de datos relacional.

    ### 2.1. Sincronización en Tiempo Real con Base de Datos Relacional (gRPC ➔ PostgreSQL ➔ REST)
    Para dar total garantía de consistencia transaccional y evitar discrepancias entre canales:
    1. Cada evento recibido por gRPC (`PushStockUpdate` o `StreamInventoryChanges`) actualiza de forma inmediata y atómica el registro correspondiente en la tabla relacional `schema_atracciones.turnos_aforo`.
    2. La consulta REST `GET /atracciones/{id}/disponibilidad` consulta directamente dicha tabla con nivel de aislamiento `READ COMMITTED`, garantizando que cualquier cambio enviado por gRPC se refleje instantáneamente en la interfaz de usuario y en el motor de reservas.
    3. Al crearse una reserva vía `POST /atracciones/reservas`, el microservicio aplica un bloqueo pesimista/optimista transaccional (ACID), descontando los cupos correspondientes y emitiendo el evento Outbox.

    ### 2.2. Especificación Oficial de Envío de Stock por gRPC
    Para dar cumplimiento al Criterio Excluyente (CE01) y a la directriz de sincronización en tiempo real:
    1. **Endpoint Inbound de Ingesta:** `grpc://booking.epn.edu.ec:50051` (En entorno de desarrollo local: `localhost:50051`).
    2. **Protocolo de Transporte:** HTTP/2 multiplexado binario (cleartext h2c en red interna / Docker, TLS en producción pública).
    3. **Servicio Protobuf:** `inventory.InventoryStockService`.
    4. **Métodos RPC Habilitados:**
       - `rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);` (Envío puntual obligatorio ante cada venta, anulación o recarga de aforo).
       - `rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);` (Streaming continuo de deltas de inventario para alta concurrencia).
    5. **Contrato Protobuf Oficial (`src/proto/inventory.proto`):**
       ```protobuf
       syntax = "proto3";
       package inventory;

       service InventoryStockService {
         // Envío puntual de actualización de cupos por turno
         rpc PushStockUpdate (StockUpdateMessage) returns (StockUpdateAck);
         // Streaming continuo de eventos de cambio de inventario
         rpc StreamInventoryChanges (stream StockChangeEvent) returns (StreamSummary);
       }

       message StockUpdateMessage {
         string service_id = 1;      // Identificador único de la tienda (ej. "atracciones-dilan")
         string item_id = 2;         // ID de la atracción o tour (ej. "atr-quito-01")
         string date = 3;            // Fecha del turno en formato YYYY-MM-DD (ej. "2026-10-25")
         string time_slot = 4;       // Franja horaria del turno (ej. "10:30 a.m.")
         int32 available_units = 5;  // Cupos remanentes disponibles en tiempo real (0 si agotado)
         int64 timestamp = 6;        // Timestamp Epoch en milisegundos
       }

       message StockUpdateAck {
         bool success = 1;
         string message = 2;
         int64 processed_at = 3;
       }

       message StockChangeEvent {
         string event_id = 1;
         string service_id = 2;
         string item_id = 3;
         string date = 4;
         string time_slot = 5;
         int32 delta = 6;            // Cambio neto (+1, -2 cupos)
         int64 timestamp = 7;
       }

       message StreamSummary {
         int32 total_events_processed = 1;
         bool is_synchronized = 2;
         string last_sync_hash = 3;
       }
       ```

    ---

    ## 3. Mandato de Cátedra RDA2: Cuestionario B2B de Acuerdo de Promociones y Combos
    Conforme a lo dictado expresamente por la cátedra en las Consideraciones RDA2 (Página 149):
    > *"En el contrato con los partners se solicita una sola vez: si acepta hacer promociones y cuál es el porcentaje máximo de descuento que estaría dispuesto a aplicar."*

    Para formalizar esta alianza comercial y permitir a Booking estructurar paquetes combinados (ej. Tour + Hotel + Vuelo):
    * **Consulta del Acuerdo Vigente:** `GET /atracciones/promociones/contrato` retorna los términos pactados actualmente.
    * **Declaración / Formalización Obligatoria:** `PUT /atracciones/promociones/contrato` permite a la tienda socia (o a su agente inteligente) responder oficialmente a las preguntas de la cátedra:
      1. `permite_promociones` (boolean): ¿Acepta participar en la creación de promociones y combos de paquetes turísticos multidominio con Booking Prototipo?
      2. `porcentaje_descuento_maximo` (number): Si acepta, ¿cuál es el porcentaje máximo de descuento que autoriza aplicar sobre la tarifa pública base (ej. 15.0%)?
      3. `destinos_habilitados` (array): Lista de ciudades o destinos donde aplica la promoción (ej. `["Quito", "Baños", "Cuenca", "Galápagos"]`).
      4. `vigencia_hasta` (date): Fecha hasta la cual se garantiza la vigencia del acuerdo comercial.
      5. `condiciones_combo` (string): Restricciones y términos de aplicación (ej. compra anticipada de 48 horas).

    ---

    ## 4. Protocolo de Errores Estandarizado (RFC 7807 Problem Details)
    Todas las respuestas de error utilizan el formato estándar `application/problem+json` con la estructura:
    ```json
    {
      "type": "https://booking.epn.edu.ec/errors/sin-cupos",
      "title": "Cupos Agotados para el Turno Horario",
      "status": 409,
      "detail": "No existen suficientes cupos disponibles en el turno seleccionado (10:30 a.m.). Cupos restantes: 1, solicitados: 2.",
      "instance": "/api/v3/atracciones/reservas",
      "code": "OUT_OF_STOCK",
      "correlation_id": "cid-8821a",
      "timestamp": "2026-10-21T16:44:01Z"
    }
    ```

servers:
  - url: /api/v3
    description: API Gateway Booking Prototipo — Ruta base canónica v3 (Producción / Local)
  - url: https://rda1-backend-integracion-sistemas.onrender.com/api/v3
    description: Servidor de Producción Central Desplegado en Render (HTTPS)
  - url: http://localhost:3000/api/v3
    description: Entorno de Desarrollo Local del Gateway NestJS (v3)
  - url: /api/v2
    description: Ruta de Compatibilidad v2 (Mantenida activa para integradores existentes)
  - url: /api/v1
    description: Ruta Legacy v1 (Compatibilidad hacia atrás)

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Atracciones - Catálogo y Búsqueda v2
    description: Endpoints de exploración de experiencias, búsqueda con filtros avanzados y taxonomía jerárquica de categorías.
  - name: Atracciones - Disponibilidad y Turnos Horarios v2
    description: Consulta en tiempo real de franjas horarias (Time Slots) y control de aforo por fecha.
  - name: Atracciones - Reservas y Coordinación Saga v2
    description: Orquestación transaccional de compras, contratos de respuesta para Sagas (201 Created / 409 Conflict) y compensaciones LIFO.
  - name: Atracciones - Check-in Presencial y Postventa v2
    description: Check-in presencial con validación de identidad del titular por el guía, canje de voucher QR y sincronización de calendario (.ICS).
  - name: Atracciones - Promociones B2B y Combos v2
    description: Consulta de acuerdos comerciales para paquetes turísticos y porcentaje de descuento máximo.
  - name: Atracciones - Outbox EDA y Telemetría de Nodo v2
    description: Feed de eventos asíncronos Outbox para streaming hacia Kafka/RabbitMQ y telemetría de salud de nodo (Semáforo 🟢/🔴).

paths:
  /atracciones/categorias/arbol:
    get:
      tags:
        - Atracciones - Catálogo y Búsqueda v2
      summary: Consultar árbol jerárquico recursivo de categorías (Taxonomía padre-hija)
      security: []
      description: |
        Retorna la estructura en árbol de las categorías turísticas con soporte multinivel (implementado mediante `@Tree('closure-table')` o autorreferencia `cat_padre_id`).
        Cada nodo incluye de forma obligatoria los atributos de inclusión exigidos por la cátedra:
        * `incluye_comida`: Almuerzos, cenas, degustaciones de chocolate o catas de café.
        * `incluye_transporte`: Recogida en hotel, transporte turístico privado o bus panorámico.
        * `incluye_guia`: Acompañamiento de guía turístico oficial certificado.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Árbol recursivo de categorías recuperado exitosamente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTreeNode'
              example:
                - id: "cat-tours-100"
                  nombre: "Tours y Experiencias Guiadas"
                  slug: "tours-experiencias"
                  descripcion: "Actividades de inmersión cultural y natural con guías expertos."
                  icono: "compass"
                  incluye_comida: false
                  incluye_transporte: true
                  incluye_guia: true
                  orden: 1
                  subcategorias:
                    - id: "cat-tours-201"
                      nombre: "Tours Gastronómicos y Catas"
                      slug: "tours-gastronomicos"
                      descripcion: "Degustaciones de comida típica ecuatoriana y chocolate fino de aroma."
                      icono: "utensils"
                      incluye_comida: true
                      incluye_transporte: false
                      incluye_guia: true
                      orden: 1
                      subcategorias: []
                    - id: "cat-tours-202"
                      nombre: "Excursiones a Volcanes y Aventura"
                      slug: "volcanes-aventura"
                      descripcion: "Senderismo y expediciones al Cotopaxi, Chimborazo y Quilotoa."
                      icono: "mountain"
                      incluye_comida: true
                      incluye_transporte: true
                      incluye_guia: true
                      orden: 2
                      subcategorias: []
                - id: "cat-cultura-200"
                  nombre: "Museos y Sitios Arqueológicos"
                  slug: "museos-cultura"
                  descripcion: "Entradas directas a patrimonios y centros históricos."
                  icono: "landmark"
                  incluye_comida: false
                  incluye_transporte: false
                  incluye_guia: false
                  orden: 2
                  subcategorias: []
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/categorias:
    get:
      tags:
        - Atracciones - Catálogo y Búsqueda v2
      summary: Consultar catálogo plano de categorías con filtro por padre
      description: |
        Retorna la lista plana de categorías. Permite filtrar por `padre_id` para construir componentes visuales tipo tabs o menús desplegables sin procesar recursión en cliente.
      security: []
      parameters:
        - name: padre_id
          in: query
          required: false
          description: ID de la categoría padre para listar únicamente sus hijas directas. Si se omite, retorna todas las categorías raíz.
          schema:
            type: string
          example: "cat-tours-100"
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Listado plano de categorías.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryFlat'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/search:
    post:
      tags:
        - Atracciones - Catálogo y Búsqueda v2
      summary: Búsqueda avanzada y filtrado de experiencias turísticas
      description: |
        Permite a los usuarios buscar y filtrar atracciones por destino geográfico, fechas de viaje, franja presupuestaria, árbol de categorías y atributos específicos de confort (comida, transporte, accesibilidad).
        Si no se especifica una fecha puntual, el endpoint retorna las atracciones activas indicando el precio base referencial (*"Desde US$ XX por adulto"*).
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchAtraccionesRequestV2'
      responses:
        '200':
          description: Resultados de búsqueda obtenidos con paginación y metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAtraccionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones:
    get:
      tags:
        - Atracciones - Catálogo y Búsqueda v2
      summary: Listado paginado de atracciones turísticas
      description: Consulta el catálogo general de atracciones turísticas mediante parámetros en la URL.
      security: []
      parameters:
        - name: city
          in: query
          required: false
          description: Nombre de la ciudad turística (ej. Quito, Baños, Cuenca, Galápagos).
          schema:
            type: string
          example: "Quito"
        - name: categoria_id
          in: query
          required: false
          description: Identificador de la categoría deseada.
          schema:
            type: string
        - name: incluye_comida
          in: query
          required: false
          description: Filtrar solo atracciones que incluyan alimentación.
          schema:
            type: boolean
        - name: incluye_transporte
          in: query
          required: false
          description: Filtrar solo atracciones que incluyan traslado.
          schema:
            type: boolean
        - name: incluye_guia
          in: query
          required: false
          description: Filtrar solo experiencias con guía acreditado.
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: Número de página (1-indexed).
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados por página.
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: sort
          in: query
          required: false
          description: Criterio de ordenamiento.
          schema:
            type: string
            enum: [PRICE_ASC, PRICE_DESC, RATING_DESC, POPULARITY]
            default: POPULARITY
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Listado de experiencias turísticas recuperado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAtraccionesResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/{id}:
    get:
      tags:
        - Atracciones - Catálogo y Búsqueda v2
      summary: Consultar detalle técnico completo de una atracción por ID o Slug
      description: |
        Retorna la ficha enriquecida de la experiencia turística con:
        * Desglose analítico de puntuaciones (*ratings breakdown* en Limpieza, Servicio y Calidad-Precio).
        * Itinerario cronológico secuencial de hitos con tiempos de permanencia.
        * Punto de encuentro geoespacial con coordenadas GPS y dirección física.
        * Atributos de accesibilidad física y admisión de animales de servicio.
        * Políticas de cancelación gratuita y plazo límite antes de la actividad.
        * Parámetros para la integración en paquetes turísticos y combos dinámicos (`permite_paquete`).
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador alfanumérico único (UUID o Slug de la atracción).
          schema:
            type: string
          example: "PRhu4UBTWPBC"
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Ficha completa de la atracción recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AtraccionDetailResponseV2'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/{id}/disponibilidad:
    get:
      tags:
        - Atracciones - Disponibilidad y Turnos Horarios v2
      summary: Consultar turnos horarios (Time Slots) y aforo disponible en tiempo real
      description: |
        ### Consulta Canónica de Disponibilidad de Turnos y Aforo en Tiempo Real (RDA2)
        Permite consultar las franjas horarias operativas de una atracción turística para una fecha específica (`date` o `fecha`).
        Retorna la matriz de turnos horarios con identificador unívoco de franja (`slot_id`, ej. `slot-20261025-1030`), hora en formato 24 horas (`time_24h` / `hora_24h`, ej. `10:30:00`) y etiqueta legible (`10:30 a.m.`).
        
        Estados de Aforo Operativo:
        * `DISPONIBLE`: Turno con aforo suficiente para reserva.
        * `ULTIMOS_CUPOS`: Quedan 3 o menos cupos (activa alerta visual de escasez en el marketplace).
        * `AGOTADO`: Aforo completo (0 cupos disponibles, bloqueo preventivo de reserva).

        > **Consistencia en Tiempo Real:** Los cupos son consultados directamente desde la tabla PostgreSQL `schema_atracciones.turnos_aforo`, la cual se mantiene sincronizada con la ingesta gRPC (puerto 50051) y los bloqueos transaccionales de reservas activas.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la atracción turística (ej. `PRhu4UBTWPBC`).
          schema:
            type: string
          example: "PRhu4UBTWPBC"
        - name: date
          in: query
          required: true
          description: Fecha de la actividad en formato ISO 8601 (`YYYY-MM-DD`).
          schema:
            type: string
            format: date
          example: "2026-10-25"
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Matriz de franjas horarias y cupos disponibles recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisponibilidadResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '503':
          $ref: '#/components/responses/ProblemDetails503'

  /atracciones/reservas:
    post:
      tags:
        - Atracciones - Reservas y Coordinación Saga v2
      summary: Crear reserva de atracción con contrato formal para Sagas (Ruta canónica)
      description: |
        ### Contrato Transaccional Obligatorio de Compra y Sagas Distribuidas
        Este endpoint ejecuta la confirmación de compra y reserva de boletos en la tienda de atracciones.
        
        #### Comportamiento Esperado por el Agregador Booking Prototipo:
        1. **Respuesta Síncrona Inmediata Obligatoria:** La tienda socia DEBE procesar la reserva y responder formalmente:
           * **HTTP `201 Created`:** Compra confirmada exitosamente. Retorna el localizador `reservation_code` y el `external_order_id` obligatorio.
           * **HTTP `409 Conflict`:** **FALTA DE STOCK O TURNO HORARIO AGOTADO (`OUT_OF_STOCK`)**. Este código es el activador estándar que instruye al orquestador de Sagas de Booking a ejecutar las compensaciones en orden inverso (LIFO), devolviendo el dinero al usuario en la pasarela bancaria y liberando reservas previas.
        2. **Idempotencia Transaccional:** La cabecera `Idempotency-Key` (UUID v4) es **estrictamente obligatoria**. Si se recibe una petición con una clave ya procesada en las últimas 24 horas, el backend DEBE retornar la respuesta idéntica previa sin duplicar cobros ni descontar cupos adicionales.
        3. **Trazabilidad Distribuida:** La cabecera `X-Correlation-Id` amarra la transacción con los logs físicos y las trazas de RabbitMQ y Apache Kafka.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XNodeIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservaRequestV3'
      responses:
        '201':
          description: Reserva confirmada exitosamente. Se emiten el código PNR, voucher digital y código QR.
          headers:
            Location:
              description: URL canónica para consultar la reserva creada.
              schema:
                type: string
                example: "/api/v3/atracciones/reservas/res-dec-9921"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmadaResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '409':
          description: |
            **CONTRATO OBLIGATORIO DE FALTA DE STOCK (Trigger de Compensación Saga).**  
            Ocurre cuando el turno horario se quedó sin aforo entre la selección y el checkout, o si existe conflicto de concurrencia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: "https://booking.epn.edu.ec/errors/sin-cupos"
                title: "Cupos Agotados para el Turno Solicitado"
                status: 409
                detail: "La atracción Tour Baños Aventura Extrema no dispone de 2 cupos para el turno de las 10:30 a.m. del 2026-10-25."
                instance: "/api/v3/atracciones/reservas"
                code: "OUT_OF_STOCK"
                correlation_id: "cid-8821a"
                timestamp: "2026-10-21T16:44:01Z"
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '422':
          $ref: '#/components/responses/ProblemDetails422'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
        '503':
          $ref: '#/components/responses/ProblemDetails503'

  /atracciones/reservas/{id}:
    get:
      tags:
        - Atracciones - Reservas y Coordinación Saga v2
      summary: Consultar detalle y estado de una reserva específica
      description: Retorna el estado actual de la reserva (`CONFIRMED`, `CHECKED_IN`, `CANCELLED`), los datos de contacto y el voucher QR asociado. Requiere autenticación JWT.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la reserva (UUID o código PNR).
          schema:
            type: string
          example: "res-dec-9921"
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Ficha de la reserva recuperada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmadaResponseV2'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/reservas/{id}/cancel:
    post:
      tags:
        - Atracciones - Reservas y Coordinación Saga v2
      summary: Cancelar reserva de atracción turística (Acción de Compensación Saga)
      description: |
        ### Endpoint de Compensación y Rollback (Sagas LIFO)
        Permite anular una reserva confirmada y **reintegrar de inmediato los cupos al aforo disponible**.
        Este endpoint es invocado en dos escenarios:
        1. **Cancelación Voluntaria del Cliente:** Dentro del plazo de cancelación gratuita (ej. hasta 24 horas antes).
        2. **Acción Compensatoria de Saga (`RestaurarInventario`):** Cuando la compra de un paquete falla en un servicio posterior (ej. error en hotel o aerolínea), el orquestador de Booking ejecuta este POST para liberar los cupos y dejar el sistema en estado consistente.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la reserva a cancelar.
          schema:
            type: string
          example: "res-dec-9921"
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Reserva cancelada exitosamente y cupos reintegrados al aforo del turno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmadaResponseV2'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          $ref: '#/components/responses/ProblemDetails409'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/reservas/{id}/checkin:
    post:
      tags:
        - Atracciones - Check-in Presencial y Postventa v2
      summary: Realizar Check-in presencial en punto de encuentro con validación de identidad e idempotencia
      description: |
        ### Proceso de Check-in Presencial Exigido por la Cátedra (Consideraciones RDA2 §4)
        Valida la presentación física del turista en el punto de encuentro mediante escaneo de su código QR y verificación de cédula o pasaporte.
        Al validarse, la reserva transiciona a estado `CHECKED_IN`, se registra la fecha/hora UTC exacta de asistencia y se habilita el pase de abordar digital con el guía asignado.

        > **Garantía de Idempotencia en Escaneo Móvil:** La cabecera `Idempotency-Key` garantiza que lecturas múltiples accidentales o reintentos por red móvil inestable retornen el pase de abordar ya emitido (HTTP 200) sin disparar conflictos artificiales (HTTP 409).
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la reserva a la cual se le realizará el check-in.
          schema:
            type: string
          example: "res-dec-9921"
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
      responses:
        '200':
          description: Check-in presencial verificado y pase de abordar emitido exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '404':
          $ref: '#/components/responses/ProblemDetails404'
        '409':
          description: Conflicto porque la reserva se encuentra cancelada o ya fue procesada con otra clave de idempotencia.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/promociones/contrato:
    get:
      tags:
        - Atracciones - Promociones B2B y Combos v2
      summary: Consultar acuerdo comercial B2B para promociones y paquetes multidominio
      description: |
        ### Mandato de Consideraciones RDA2 (Página 149):
        > *"En el contrato con los partners se solicita una sola vez: si acepta hacer promociones y cuál es el porcentaje máximo de descuento que estaría dispuesto a aplicar."*
        
        Este endpoint permite al microservicio orquestador de paquetes (`MS_PKG` / `ORQ_PKG`) consultar las condiciones comerciales pactadas con la tienda de atracciones para estructurar combos con hoteles, vuelos y autos de renta.
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Términos comerciales de promociones y combos recuperados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromocionesContratoResponse'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'
    put:
      tags:
        - Atracciones - Promociones B2B y Combos v2
      summary: Actualizar y responder cuestionario B2B de promociones y paquetes multidominio
      description: |
        ### Cuestionario Obligatorio de Alianza Comercial B2B (Consideraciones RDA2, pág. 149):
        Permite a la tienda socia (o a su agente inteligente) responder o actualizar formalmente las preguntas obligatorias de la cátedra:
        1. **¿Acepta participar en la creación de promociones y combos de paquetes turísticos multidominio con Booking Prototipo?** (`permite_promociones`)
        2. **Si acepta, ¿cuál es el porcentaje máximo de descuento que está dispuesto a aplicar sobre su tarifa pública?** (`porcentaje_descuento_maximo`, ej. 15.0%)
        3. **¿Qué destinos o atracciones específicas están habilitadas para las promociones?** (`destinos_habilitados`)
        4. **¿Hasta qué fecha autoriza este acuerdo comercial?** (`vigencia_hasta`)
        5. **¿Cuáles son las condiciones y restricciones operativas?** (`condiciones_combo`)
      parameters:
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        description: Respuestas formales al cuestionario comercial de promociones y combos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPromocionesContratoRequest'
      responses:
        '200':
          description: Términos comerciales de promociones formalizados y actualizados exitosamente en Booking Prototipo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromocionesContratoResponse'
        '400':
          $ref: '#/components/responses/ProblemDetails400'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/eventos:
    get:
      tags:
        - Atracciones - Outbox EDA y Telemetría de Nodo v2
      summary: Consultar feed de eventos de integración asíncrona (Patrón Outbox)
      description: |
        Expone el registro secuencial de eventos generados por la tienda de atracciones (patrón Transactional Outbox).
        Permite a Booking Prototipo o a los consumidores EDA consultar periódicamente los cambios de estado (`RESERVA_CREADA`, `RESERVA_CONFIRMADA`, `STOCK_ACTUALIZADO`, `RESERVA_CANCELADA`) garantizando entrega confiable y sincronización con Apache Kafka y RabbitMQ.
      parameters:
        - name: after
          in: query
          required: false
          description: Cursor numérico secuencial (`evt_id`). Retorna únicamente eventos con identificador mayor al indicado.
          schema:
            type: integer
            default: 0
          example: 1042
        - name: limit
          in: query
          required: false
          description: Cantidad máxima de eventos por lote.
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: type
          in: query
          required: false
          description: Filtro opcional por tipo de evento específico.
          schema:
            type: string
            enum: [RESERVA_CREADA, RESERVA_CONFIRMADA, STOCK_ACTUALIZADO, RESERVA_CANCELADA]
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Lote de eventos de integración recuperado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboxEventItem'
        '401':
          $ref: '#/components/responses/ProblemDetails401'
        '403':
          $ref: '#/components/responses/ProblemDetails403'
        '500':
          $ref: '#/components/responses/ProblemDetails500'

  /atracciones/health:
    get:
      tags:
        - Atracciones - Outbox EDA y Telemetría de Nodo v2
      summary: Ping de salud y telemetría de nodo para el panel administrativo de Booking
      security: []
      description: |
        ### Monitor de Nodos EDA (Panel 1 de Booking Prototipo)
        Retorna el estado de disponibilidad y métricas operativas de la tienda de atracciones.
        El panel administrativo consume este endpoint cada 5 segundos para renderizar el semáforo dinámico:
        * 🟢 **Verde (`UP`):** Tienda operativa con latencia < 200ms.
        * 🟡 **Amarillo (`DEGRADED`):** Latencia degradada (200ms - 800ms) o advertencia de memoria.
        * 🔴 **Rojo (`DOWN`):** Fallo o desconexión por Kill-Switch.
      responses:
        '200':
          description: Estado de salud del nodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'
        '503':
          description: Nodo degradado o en falla crítica.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeHealthResponse'

components:
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Identificador único universal (UUID v4) generado por el cliente para garantizar idempotencia en la mutación transaccional.  
        Evita duplicación de cobros o descuento indebido de cupos ante cortes de red o reintentos automáticos.
      schema:
        type: string
        format: uuid
      example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"

    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador unívoco de trazabilidad distribuida (Semana 8 & Consideraciones RDA2).  
        Se propaga de forma invariable entre peticiones HTTP, logs JSON estructurados, mensajes de RabbitMQ y streams de Apache Kafka.
      schema:
        type: string
      example: "cid-8821a-9923"

    XNodeIdHeader:
      name: X-Node-Id
      in: header
      required: false
      description: Identificador del nodo emisor de la petición (ej. `node-booking-core-01`).
      schema:
        type: string
      example: "node-booking-core-01"

  schemas:
    CategoryTreeNode:
      type: object
      required:
        - id
        - nombre
        - slug
        - incluye_comida
        - incluye_transporte
        - incluye_guia
      properties:
        id:
          type: string
          description: Identificador único de la categoría.
          example: "cat-tours-100"
        nombre:
          type: string
          description: Nombre legible de la categoría.
          example: "Tours y Experiencias Guiadas"
        slug:
          type: string
          description: Identificador web URL-friendly.
          example: "tours-experiencias"
        descripcion:
          type: string
          description: Resumen descriptivo de las actividades de este grupo.
          example: "Recorridos por la ciudad y la naturaleza con guías titulados."
        icono:
          type: string
          description: Nombre del icono para la interfaz gráfica (FontAwesome o Lucide).
          example: "compass"
        incluye_comida:
          type: boolean
          description: Bandera booleana obligatoria. Indica si las actividades de esta categoría incluyen alimentación.
          example: false
        incluye_transporte:
          type: boolean
          description: Bandera booleana obligatoria. Indica si incluye traslado vehicular.
          example: true
        incluye_guia:
          type: boolean
          description: Bandera booleana obligatoria. Indica si incluye acompañamiento de guía profesional.
          example: true
        orden:
          type: integer
          description: Posición ordinal de renderizado en el menú.
          example: 1
        subcategorias:
          type: array
          description: Lista anidada recursiva de subcategorías hijas.
          items:
            $ref: '#/components/schemas/CategoryTreeNode'

    CategoryFlat:
      type: object
      required:
        - id
        - nombre
        - slug
      properties:
        id:
          type: string
          example: "cat-tours-201"
        padre_id:
          type: string
          nullable: true
          description: Identificador de la categoría padre (null si es categoría raíz).
          example: "cat-tours-100"
        nombre:
          type: string
          example: "Tours Gastronómicos"
        slug:
          type: string
          example: "tours-gastronomicos"
        incluye_comida:
          type: boolean
          example: true
        incluye_transporte:
          type: boolean
          example: false
        incluye_guia:
          type: boolean
          example: true

    SearchAtraccionesRequestV2:
      type: object
      properties:
        query:
          type: string
          description: Término de búsqueda libre o nombre de destino (ej. "Quito", "Mitad del Mundo").
          example: "Quito"
        ciudad:
          type: string
          description: Ciudad geográfica de destino.
          example: "Quito"
        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio de la experiencia turística (`YYYY-MM-DD`).
          example: "2026-10-25"
        fecha_fin:
          type: string
          format: date
          description: Fecha final para rangos de búsqueda flexible (`YYYY-MM-DD`).
          example: "2026-10-28"
        categoria_id:
          type: string
          description: Filtrar por identificador de categoría o subcategoría.
          example: "cat-tours-201"
        incluye_comida:
          type: boolean
          description: Filtrar únicamente experiencias que incluyan alimentación.
        incluye_transporte:
          type: boolean
          description: Filtrar únicamente experiencias que incluyan transporte.
        incluye_guia:
          type: boolean
          description: Filtrar únicamente experiencias que cuenten con guía certificado.
        precio_min:
          type: number
          minimum: 0
          description: Precio mínimo en USD por adulto.
          example: 15.00
        precio_max:
          type: number
          description: Precio máximo en USD por adulto.
          example: 150.00
        duracion_max_horas:
          type: integer
          description: Límite de duración en horas (ej. 4 para tours de medio día).
          example: 8
        idioma_guia:
          type: string
          description: Idioma requerido del guía (ej. "Español", "Inglés", "Francés").
          example: "Español"
        accesible_silla_ruedas:
          type: boolean
          description: Filtro de accesibilidad universal para personas en silla de ruedas.
        animales_asistencia:
          type: boolean
          description: Filtro de admisión obligatoria de animales de asistencia o lazarillos.
        cancelacion_gratuita:
          type: boolean
          description: Filtro de tours con cancelación sin costo hasta 24 horas antes.
        adult_count:
          type: integer
          default: 1
          minimum: 1
          description: Cantidad de personas adultas para cotizar disponibilidad.
        cantidad_adultos:
          type: integer
          default: 1
          minimum: 1
          description: Alias canónico en español para cantidad de adultos solicitados.
        page:
          type: integer
          default: 1
          minimum: 1
        limit:
          type: integer
          default: 10
          maximum: 50

    SearchAtraccionesResponseV2:
      type: object
      required:
        - metadata
        - data
      properties:
        request_id:
          type: string
          example: "req-atr-8812"
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'
        data:
          type: array
          items:
            $ref: '#/components/schemas/AtraccionCardResponseV2'

    PaginationMetadata:
      type: object
      required:
        - total_results
        - page
        - limit
        - total_pages
      properties:
        total_results:
          type: integer
          example: 32
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total_pages:
          type: integer
          example: 4
        next_cursor:
          type: string
          nullable: true
          example: "eyJvZmZzZXQiOjEwfQ=="

    AtraccionCardResponseV2:
      type: object
      required:
        - id
        - name
        - city
        - price
        - rating
        - duration
        - inclusions
      properties:
        id:
          type: string
          description: Identificador único público (ej. ID alfanumérico de Dilan o UUID).
          example: "PRhu4UBTWPBC"
        slug:
          type: string
          example: "quito-city-bus-tour-mitad-del-mundo"
        name:
          type: string
          example: "Quito City Bus Tour & Mitad del Mundo Oficial"
        short_description:
          type: string
          example: "Recorrido panorámico de dos pisos por el Centro Histórico y la Ciudad Mitad del Mundo."
        city:
          type: string
          example: "Quito"
        duration:
          type: string
          example: "7 horas"
        duration_hours:
          type: number
          example: 7.0
        price:
          $ref: '#/components/schemas/TarifaBaseDesglosada'
        rating:
          $ref: '#/components/schemas/RatingResumen'
        free_cancellation:
          type: boolean
          description: Indica si el tour admite cancelación gratuita sin penalidad.
          example: true
        free_cancellation_hours:
          type: integer
          description: Plazo de horas de antelación para cancelar gratis.
          example: 24
        inclusions:
          $ref: '#/components/schemas/InclusionesFlags'
        meeting_point:
          type: string
          example: "Boulevard Naciones Unidas y Av. Shyris (Parada Quinde)"
        photos:
          type: array
          items:
            type: string
          example:
            - "https://images.unsplash.com/photo-1589394815804-964ed0be2eb5?w=600"
            - "https://images.unsplash.com/photo-1596436889106-be35e843f974?w=600"
        permite_paquete:
          type: boolean
          description: Bandera que habilita el armado de paquetes y combos turísticos con descuento en Booking.
          example: true
        nombre:
          type: string
          description: Alias canónico en español para nombre de la atracción.
          example: "Quito City Bus Tour & Mitad del Mundo Oficial"
        descripcion_corta:
          type: string
          description: Alias canónico en español para descripción corta.
