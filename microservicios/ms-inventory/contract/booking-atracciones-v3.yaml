    OutboxEventItem:
      type: object
      description: Evento de integración para arquitecturas orientadas a eventos (EDA) conforme al estándar CloudEvents v1.0 (Semana 8 & Consideraciones RDA2).
      required:
        - specversion
        - source
        - event_id
        - sequence_number
        - event_type
        - aggregate_id
        - correlation_id
        - timestamp
        - payload
      properties:
        specversion:
          type: string
          description: Versión de la especificación CloudEvents (v1.0 obligatorio de cátedra).
          example: "1.0"
        source:
          type: string
          description: Identificador URI del microservicio productor emisor del evento.
          example: "/api/v3/atracciones"
        event_id:
          type: string
          format: uuid
          description: Identificador universal único del evento (CloudEvents id).
          example: "e55a12f9-71c2-4a0b-87d3-0570b24dc6c1"
        sequence_number:
          type: integer
          description: Número monótono creciente que facilita el consumo secuencial por cursor (`after`).
          example: 1043
        event_type:
          type: string
          enum: [RESERVA_CREADA, RESERVA_CONFIRMADA, STOCK_ACTUALIZADO, RESERVA_CANCELADA]
          description: Tipo de evento de dominio publicado hacia los brokers RabbitMQ y Apache Kafka.
          example: "RESERVA_CONFIRMADA"
        aggregate_id:
          type: string
          description: Identificador de la reserva o atracción afectada.
          example: "DEC-7F3K9Q"
        correlation_id:
          type: string
          description: Identificador de correlación unívoco para trazabilidad distribuida cross-broker.
          example: "cid-8821a"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo ISO 8601 UTC en que se emitió el evento.
          example: "2026-10-21T16:44:01Z"
        payload:
          type: object
          description: Carga útil con los datos minimizados del evento.
        data:
          type: object
          description: Alias oficial CloudEvents v1.0 para el payload del evento y datos minimizados del evento según el estándar canónico de eventos EDA.

